name: Automated Daily Contributions & Telemetry

on:
  schedule:
    # Runs 4 times daily across jittered windows (every ~6 hours)
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force contribution regardless of daily target'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-contributions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commit:
    name: Record Verified Daily Contribution (Hourly Token)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📝 Record Dynamic Daily Contribution
        id: record
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          python scripts/daily_contributions.py $FORCE_FLAG || exit_code=$?
          if [ "${exit_code:-0}" -eq 2 ]; then
            echo "status=already_completed" >> $GITHUB_OUTPUT
            echo "Daily contribution target already satisfied for today."
          else
            echo "status=recorded" >> $GITHUB_OUTPUT
            python scripts/generate_stats_card.py
          fi

      - name: 🚀 Commit and Push via Hourly Token
        if: steps.record.outputs.status == 'recorded'
        run: |
          git config user.name "Priya-Ranjan-0201"
          git config user.email "186106336+Priya-Ranjan-0201@users.noreply.github.com"

          git add data/ assets/github-stats.svg assets/telemetry-metrics.svg
          git commit -m "chore(activity): log verified telemetry cycle via hourly token"
          git pull --rebase origin main || true
          git push origin HEAD:main

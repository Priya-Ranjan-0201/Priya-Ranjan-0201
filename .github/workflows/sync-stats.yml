name: Synchronize Live Telemetry Stats

on:
  schedule:
    # Run every 6 hours to keep stats 100% fresh with daily changes
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_stats_card.py'

permissions:
  contents: write

concurrency:
  group: sync-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-stats:
    name: Sync Live GitHub Telemetry & Streak
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📊 Fetch Live Stats & Generate Card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_stats_card.py

      - name: 🚀 Commit and Push Updated Stats
        run: |
          git add assets/github-stats.svg
          if git diff --staged --quiet; then
            echo "Telemetry stats are already up-to-date. No commit needed."
            exit 0
          fi

          COMMIT_NAME="${{ vars.COMMIT_NAME || 'Priya-Ranjan-0201' }}"
          COMMIT_EMAIL="${{ vars.COMMIT_EMAIL || '186106336+Priya-Ranjan-0201@users.noreply.github.com' }}"

          git config --local user.name "$COMMIT_NAME"
          git config --local user.email "$COMMIT_EMAIL"

          git commit -m "chore: synchronize live telemetry stats via hourly token"
          git pull --rebase origin main || true
          git push origin main

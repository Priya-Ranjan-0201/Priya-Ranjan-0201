name: Synchronize Live Telemetry Stats & Daily Activity

on:
  schedule:
    # Runs 4 times a day across jittered windows (every ~6 hours)
    - cron: '15 2,8,14,20 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_stats_card.py'
      - 'scripts/daily_heartbeat.py'

permissions:
  contents: write

concurrency:
  group: sync-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-stats:
    name: Sync Live GitHub Telemetry & Daily Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📊 Record Daily Telemetry & Generate Card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/daily_heartbeat.py || true
          python scripts/generate_stats_card.py

      - name: 🚀 Commit and Push Updated Stats
        run: |
          git add data/telemetry_heartbeat.json assets/github-stats.svg assets/telemetry-metrics.svg
          if git diff --staged --quiet; then
            echo "Telemetry stats are already up-to-date. No commit needed."
            exit 0
          fi

          git config user.name "Priya-Ranjan-0201"
          git config user.email "186106336+Priya-Ranjan-0201@users.noreply.github.com"

          git commit -m "chore(telemetry): record verified engineering cycle & sync stats"
          git pull --rebase origin main || true
          git push origin HEAD:main

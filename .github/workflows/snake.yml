name: Generate Contribution Snake

on:
  schedule:
    # Run automatically every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2339FF14&color_dots=%2308170B,%23174A24,%23247A35,%2339FF14,%23B9FFB0
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2339FF14&color_dots=%2308170B,%23174A24,%23247A35,%2339FF14,%23B9FFB0

      - name: Deploy Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

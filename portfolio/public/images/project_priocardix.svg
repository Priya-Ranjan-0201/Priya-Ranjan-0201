<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" role="img" aria-label="Priocardix-AI Preventive Cardiology Platform &amp; Neural ECG Biometric Radar">
  <defs>
    <!-- Background & Depth -->
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031207"/>
      <stop offset="45%" stop-color="#082A14"/>
      <stop offset="100%" stop-color="#020E05"/>
    </linearGradient>

    <!-- Super Vivid Light Green Gradients -->
    <linearGradient id="p-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFAA"/>
      <stop offset="45%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>

    <linearGradient id="p-heart-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="45%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <linearGradient id="p-heart-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFAA"/>
      <stop offset="45%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>

    <radialGradient id="p-bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#4ADE80" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#031207" stop-opacity="0"/>
    </radialGradient>

    <!-- Medical ECG Light Green Grid Pattern -->
    <pattern id="p-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#16A34A" stroke-width="0.7" opacity="0.45"/>
      <circle cx="26" cy="26" r="1.2" fill="#4ADE80" opacity="0.5"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="p-glow-heavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="14" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="p-glow-mid" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate & Grid -->
  <rect width="760" height="360" rx="16" fill="url(#p-bg)"/>
  <rect width="760" height="360" rx="16" fill="url(#p-grid)"/>
  <rect width="756" height="356" x="2" y="2" rx="15" fill="none" stroke="#22C55E" stroke-width="1.8"/>

  <!-- High-Tech Corner Brackets -->
  <path d="M12 38V12H38M748 38V12H722M12 322V348H38M748 322V348H722" fill="none" stroke="#4ADE80" stroke-width="2.6" opacity="0.95"/>
  <circle cx="12" cy="12" r="3.5" fill="#39FF14" filter="url(#p-glow-mid)"/>
  <circle cx="748" cy="12" r="3.5" fill="#39FF14" filter="url(#p-glow-mid)"/>
  <circle cx="12" cy="348" r="3.5" fill="#39FF14" filter="url(#p-glow-mid)"/>
  <circle cx="748" cy="348" r="3.5" fill="#39FF14" filter="url(#p-glow-mid)"/>

  <!-- Top System Header Banner -->
  <g font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="11">
    <rect x="28" y="16" width="8" height="8" fill="#39FF14">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="44" y="24" fill="#39FF14" font-weight="800" letter-spacing="3">PRIOCARDIX-AI // PREVENTIVE CARDIOLOGY</text>
    <text x="530" y="24" fill="#A7F3D0" letter-spacing="1.5">TreeSHAP · CARDIAC BIO-SIGNAL</text>
    <circle cx="724" cy="20" r="4.5" fill="#39FF14">
      <animate attributeName="r" values="3;6;3" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <line x1="28" y1="36" x2="732" y2="36" stroke="#22C55E" stroke-width="1.2"/>

  <!-- Core Radiant Glow -->
  <circle cx="380" cy="144" r="160" fill="url(#p-bloom)"/>

  <!-- Left Telemetry: Clinical Vitals & Rhythm -->
  <g transform="translate(38, 80)" font-family="'SF Mono', 'Fira Code', monospace">
    <text x="0" y="0" fill="#86EFAC" font-size="9.5" font-weight="700" letter-spacing="2">CARDIAC VITALS</text>
    
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="98" height="22" rx="4" fill="#0A2C16" stroke="#22C55E"/>
      <text x="10" y="15" fill="#86EFAC" font-size="9.5" font-weight="700">HR: 74 BPM</text>
      
      <rect x="0" y="28" width="98" height="22" rx="4" fill="#0A2C16" stroke="#22C55E"/>
      <text x="10" y="43" fill="#86EFAC" font-size="9.5" font-weight="700">R-R: 812 MS</text>
      
      <rect x="0" y="56" width="98" height="22" rx="4" fill="#0A2C16" stroke="#22C55E"/>
      <text x="10" y="71" fill="#86EFAC" font-size="9.5" font-weight="700">QRS: 96 MS</text>
    </g>

    <text x="0" y="98" fill="#FFFFFF" font-size="13" font-weight="900" letter-spacing="1">SINUS RHYTHM</text>
    <text x="0" y="112" fill="#A7F3D0" font-size="8.5" letter-spacing="1">STABLE SIGNAL</text>
  </g>

  <!-- Right Telemetry: TreeSHAP Explainability Gauge -->
  <g transform="translate(620, 80)" font-family="'SF Mono', 'Fira Code', monospace">
    <text x="0" y="0" fill="#86EFAC" font-size="9.5" font-weight="700" letter-spacing="2">TreeSHAP EXPLAIN</text>
    
    <!-- Animated Risk Gauge -->
    <g transform="translate(30, 36)">
      <circle r="26" fill="#092814" stroke="#22C55E" stroke-width="1.8"/>
      <circle r="21" fill="none" stroke="#16A34A" stroke-width="3" stroke-dasharray="130" stroke-dashoffset="130"/>
      <circle r="21" fill="none" stroke="#39FF14" stroke-width="3.5" stroke-dasharray="130" stroke-dashoffset="26" filter="url(#p-glow-mid)">
        <animate attributeName="stroke-dashoffset" values="50;18;32" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="5" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="900">LOW</text>
    </g>

    <text x="0" y="82" fill="#FFFFFF" font-size="13" font-weight="900" letter-spacing="1">RISK: 4.2%</text>
    <text x="0" y="96" fill="#A7F3D0" font-size="8.5" letter-spacing="1">OPTIMAL WINDOW</text>

    <!-- SHAP Factor Badge -->
    <rect x="0" y="108" width="98" height="24" rx="5" fill="#0A2C16" stroke="#22C55E" stroke-width="1.2"/>
    <text x="10" y="124" fill="#86EFAC" font-size="9.5" font-weight="700" letter-spacing="1.2">SHAP: CONFIDENT</text>
  </g>

  <!-- ==================== CENTRAL CYBER-HEART & CARDIAC PULSE ==================== -->
  <g transform="translate(380, 138)">
    <!-- Base Reticle Plate Housing -->
    <circle r="102" fill="#082613" stroke="#22C55E" stroke-width="1.5"/>
    <circle r="92" fill="none" stroke="#4ADE80" stroke-width="1.2" stroke-dasharray="3 7" opacity="0.75"/>

    <!-- Rotating Telemetry Ticks (Clockwise, 12s) -->
    <circle r="82" fill="none" stroke="#4ADE80" stroke-width="1.8" stroke-dasharray="6 14" opacity="0.9" filter="url(#p-glow-mid)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- Expanding Heartbeat Pulse Waves -->
    <circle r="44" fill="none" stroke="#39FF14" stroke-width="2.5" opacity="0.85">
      <animate attributeName="r" values="36;96;36" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- ==================== PROMINENT FACETED LOW-POLY CYBER-HEART ==================== -->
    <g filter="url(#p-glow-heavy)">
      <!-- Realistic Double-Systolic Cardiac Heartbeat Animation (1.0s cycle) -->
      <g>
        <animateTransform attributeName="transform" type="scale" 
          values="1; 1.15; 1.05; 1.18; 1" 
          keyTimes="0; 0.16; 0.30; 0.46; 1" 
          dur="1s" repeatCount="indefinite"/>

        <!-- Left Heart Hemisphere -->
        <path d="M0 50 C-18 34 -54 10 -54 -20 C-54 -50 -18 -54 0 -26 Z" 
              fill="url(#p-heart-left)" stroke="#39FF14" stroke-width="2.5" stroke-linejoin="round"/>
        
        <!-- Right Heart Hemisphere -->
        <path d="M0 50 C18 34 54 10 54 -20 C54 -50 18 -54 0 -26 Z" 
              fill="url(#p-heart-right)" stroke="#00FFAA" stroke-width="2.5" stroke-linejoin="round"/>
        
        <!-- Inner Facet Insets -->
        <polygon points="0,-18 -20,-36 -30,-14 -10,14 0,30" fill="#061F0E" opacity="0.75"/>
        <polygon points="0,-18 20,-36 30,-14 10,14 0,30" fill="#0A2E16" opacity="0.75"/>

        <!-- High-Intensity Clinical ECG Trace Across Heart -->
        <path d="M-38 0 H-18 L-9 -22 L5 24 L16 -10 L24 0 H38" 
              fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-38 0 H-18 L-9 -22 L5 24 L16 -10 L24 0 H38" 
              fill="none" stroke="#39FF14" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Heart Center Pure White Core Beacon -->
        <circle cx="0" cy="-2" r="4.5" fill="#FFFFFF" filter="url(#p-glow-heavy)">
          <animate attributeName="r" values="3.5;6.5;3.5" dur="1s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Cardinal Crosshair Ticks -->
    <path d="M-72 0H-56M56 0H72M0 -72V-56M0 56V72" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- ==================== LOGO HEADLINE & READOUT ==================== -->
  <g text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
    <text x="380" y="246" fill="#FFFFFF" font-size="23" font-weight="900" letter-spacing="7" filter="url(#p-glow-mid)">PRIOCARDIX-AI</text>
    <text x="380" y="266" fill="#A7F3D0" font-size="11" font-weight="700" letter-spacing="3.2">PREVENTIVE CARDIOLOGY · TreeSHAP EXPLAINABILITY</text>
  </g>

  <!-- Bottom High-Intensity Clinical ECG Phosphor Waveform Bar -->
  <g transform="translate(95, 278)">
    <rect width="570" height="46" rx="9" fill="#082512" stroke="#22C55E" stroke-width="1.5"/>
    
    <!-- Background Calibration Grid -->
    <line x1="20" y1="23" x2="550" y2="23" stroke="#15803D" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
    
    <!-- Bold Sharp Clinical ECG Trace with P-Q-R-S-T Complex -->
    <path d="M20 23 H110 L120 23 L126 17 L132 23 H146 L152 9 L162 38 L170 3 L178 27 L186 23 H200 L208 17 L218 23 H300 L310 23 L316 17 L322 23 H336 L342 9 L352 38 L360 3 L368 27 L376 23 H390 L398 17 L408 23 H490 L500 23 L506 17 L512 23 H550" 
          fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    
    <path d="M20 23 H110 L120 23 L126 17 L132 23 H146 L152 9 L162 38 L170 3 L178 27 L186 23 H200 L208 17 L218 23 H300 L310 23 L316 17 L322 23 H336 L342 9 L352 38 L360 3 L368 27 L376 23 H390 L398 17 L408 23 H490 L500 23 L506 17 L512 23 H550" 
          fill="none" stroke="#39FF14" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="600" stroke-dashoffset="600" filter="url(#p-glow-heavy)">
      <animate attributeName="stroke-dashoffset" values="600;0" dur="2.8s" repeatCount="indefinite"/>
    </path>

    <!-- Moving Laser Scan Phosphor Point -->
    <circle cx="20" cy="23" r="5" fill="#FFFFFF" filter="url(#p-glow-heavy)">
      <animate attributeName="cx" values="20;550" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom Status Footer -->
  <g font-family="'SF Mono', 'Fira Code', monospace" font-size="10">
    <text x="28" y="344" fill="#4ADE80" font-weight="700" letter-spacing="2">● REAL-TIME CARDIAC MONITOR</text>
    <text x="732" y="344" text-anchor="end" fill="#A7F3D0" letter-spacing="1.5">TreeSHAP: SBP (0.42) · CHOL (0.31) · BMI (0.18)</text>
  </g>
</svg>
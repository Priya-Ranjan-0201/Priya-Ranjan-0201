<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" height="100%" role="img" aria-label="Disk Scheduling Visualizer Storage Kinematics &amp; Algorithm Simulator">
  <defs>
    <!-- Background & Depth -->
    <linearGradient id="d-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020904"/>
      <stop offset="40%" stop-color="#061C0D"/>
      <stop offset="100%" stop-color="#010602"/>
    </linearGradient>

    <!-- Super Vivid Neon Gradients -->
    <linearGradient id="d-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFAA"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#95FF00"/>
    </linearGradient>

    <linearGradient id="d-platter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C361A"/>
      <stop offset="50%" stop-color="#04180A"/>
      <stop offset="100%" stop-color="#144C26"/>
    </linearGradient>

    <radialGradient id="d-bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#00FF88" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020904" stop-opacity="0"/>
    </radialGradient>

    <!-- Lab Grid Pattern -->
    <pattern id="d-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#13431D" stroke-width="0.75" opacity="0.65"/>
      <circle cx="26" cy="26" r="1" fill="#39FF14" opacity="0.4"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="d-glow-heavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="14" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="d-glow-mid" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate & Grid -->
  <rect width="760" height="360" rx="16" fill="url(#d-bg)"/>
  <rect width="760" height="360" rx="16" fill="url(#d-grid)"/>
  <rect width="756" height="356" x="2" y="2" rx="15" fill="none" stroke="#1D602D" stroke-width="1.8"/>

  <!-- High-Tech Corner Brackets -->
  <path d="M12 38V12H38M748 38V12H722M12 322V348H38M748 322V348H722" fill="none" stroke="#39FF14" stroke-width="2.6" opacity="0.95"/>
  <circle cx="12" cy="12" r="3.5" fill="#39FF14" filter="url(#d-glow-mid)"/>
  <circle cx="748" cy="12" r="3.5" fill="#39FF14" filter="url(#d-glow-mid)"/>
  <circle cx="12" cy="348" r="3.5" fill="#39FF14" filter="url(#d-glow-mid)"/>
  <circle cx="748" cy="348" r="3.5" fill="#39FF14" filter="url(#d-glow-mid)"/>

  <!-- Top System Header Banner -->
  <g font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="11">
    <rect x="28" y="16" width="8" height="8" fill="#39FF14">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="44" y="24" fill="#39FF14" font-weight="800" letter-spacing="3">DISK SCHEDULING VISUALIZER // OPERATING SYSTEMS</text>
    <text x="525" y="24" fill="#B9FFB0" letter-spacing="1.5">60 FPS CANVAS · 11 ALGORITHMS</text>
    <circle cx="724" cy="20" r="4.5" fill="#39FF14">
      <animate attributeName="r" values="3;6;3" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <line x1="28" y1="36" x2="732" y2="36" stroke="#1D602D" stroke-width="1.2"/>

  <!-- Core Radiant Glow -->
  <circle cx="380" cy="136" r="160" fill="url(#d-bloom)"/>

  <!-- Left Telemetry: Disk Kinematics Indices -->
  <g transform="translate(38, 76)" font-family="'SF Mono', 'Fira Code', monospace">
    <text x="0" y="0" fill="#8DBF91" font-size="9.5" font-weight="700" letter-spacing="2">DISK KINEMATICS</text>
    
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="98" height="22" rx="4" fill="#082211" stroke="#1D602D"/>
      <text x="10" y="15" fill="#39FF14" font-size="9.5" font-weight="700">CYLS: 0 - 600</text>
      
      <rect x="0" y="28" width="98" height="22" rx="4" fill="#082211" stroke="#1D602D"/>
      <text x="10" y="43" fill="#39FF14" font-size="9.5" font-weight="700">SEEK: 2.4 MS</text>
      
      <rect x="0" y="56" width="98" height="22" rx="4" fill="#082211" stroke="#1D602D"/>
      <text x="10" y="71" fill="#39FF14" font-size="9.5" font-weight="700">RPM: 7200</text>
    </g>

    <text x="0" y="98" fill="#FFFFFF" font-size="13" font-weight="900" letter-spacing="1">60 FPS CANVAS</text>
    <text x="0" y="112" fill="#8DBF91" font-size="8.5" letter-spacing="1">REAL-TIME SIMULATION</text>
  </g>

  <!-- Right Telemetry: Benchmark Algorithms -->
  <g transform="translate(620, 76)" font-family="'SF Mono', 'Fira Code', monospace">
    <text x="0" y="0" fill="#8DBF91" font-size="9.5" font-weight="700" letter-spacing="2">BENCHMARKS</text>
    
    <!-- Rotating Platter Reticle -->
    <g transform="translate(30, 36)">
      <circle r="26" fill="#071E0F" stroke="#1D602D" stroke-width="1.8"/>
      <circle r="18" fill="none" stroke="#247A35" stroke-dasharray="3 4"/>
      <!-- Arm Sweep -->
      <g>
        <line x1="-20" y1="20" x2="12" y2="-12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="12" cy="-12" r="3.5" fill="#39FF14"/>
        <circle cx="-20" cy="20" r="4.5" fill="#0C2D16" stroke="#39FF14"/>
        <animateTransform attributeName="transform" type="rotate" values="0;28;-18;0" dur="3s" repeatCount="indefinite"/>
      </g>
    </g>

    <text x="0" y="82" fill="#FFFFFF" font-size="13" font-weight="900" letter-spacing="1">SSTF · C-SCAN</text>
    <text x="0" y="96" fill="#8DBF91" font-size="8.5" letter-spacing="1">11 ALGORITHMS</text>

    <!-- Min Seek Tag -->
    <rect x="0" y="108" width="98" height="24" rx="5" fill="#082211" stroke="#247A35" stroke-width="1.2"/>
    <text x="10" y="124" fill="#39FF14" font-size="9.5" font-weight="700" letter-spacing="1.2">SEEK OPTIMIZED</text>
  </g>

  <!-- ==================== ROTATING MAGNETIC DISK & ACTUATOR ARM ==================== -->
  <g transform="translate(380, 134)">
    <!-- Base Platter Chassis -->
    <rect x="-106" y="-76" width="212" height="152" rx="16" fill="#051A0C" stroke="#1D602D" stroke-width="1.5"/>
    
    <!-- High-Precision Spinning Magnetic Platter -->
    <circle cx="-20" cy="0" r="70" fill="url(#d-platter)" stroke="#39FF14" stroke-width="2.4" filter="url(#d-glow-mid)"/>
    
    <!-- Concentric Track Grooves (Cylinders) -->
    <circle cx="-20" cy="0" r="58" fill="none" stroke="#174A24" stroke-width="1.2"/>
    <circle cx="-20" cy="0" r="46" fill="none" stroke="#247A35" stroke-width="1.2" stroke-dasharray="3 4"/>
    <circle cx="-20" cy="0" r="34" fill="none" stroke="#174A24" stroke-width="1.2"/>
    <circle cx="-20" cy="0" r="22" fill="none" stroke="#247A35" stroke-width="1.2"/>

    <!-- High-Speed Rotating Track Sectors (Fast 3s Rotation!) -->
    <g transform="translate(-20, 0)">
      <line x1="-70" y1="0" x2="70" y2="0" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="-70" x2="0" y2="70" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- Center Spindle Motor Hub -->
    <circle cx="-20" cy="0" r="16" fill="#082A14" stroke="#39FF14" stroke-width="2.5"/>
    <circle cx="-20" cy="0" r="6" fill="#FFFFFF"/>

    <!-- ==================== PROMINENT ARTICULATED HEAD ACTUATOR ARM ==================== -->
    <g transform="translate(62, 38)">
      <circle cx="0" cy="0" r="16" fill="#082613" stroke="#247A35" stroke-width="2.4"/>
      <circle cx="0" cy="0" r="7" fill="#39FF14"/>

      <!-- Sweeping Actuator Arm Assembly -->
      <g filter="url(#d-glow-heavy)">
        <polygon points="0,-5 -76,-44 -84,-42 -72,-37 0,5" fill="url(#d-neon)"/>
        <line x1="0" y1="0" x2="-78" y2="-41" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
        <!-- Read/Write Laser Head Tip -->
        <circle cx="-78" cy="-41" r="4" fill="#FFFFFF"/>
        <circle cx="-78" cy="-41" r="8" fill="none" stroke="#39FF14" stroke-width="2">
          <animate attributeName="r" values="4;12;4" dur="0.8s" repeatCount="indefinite"/>
        </circle>
        
        <!-- Smooth Actuator Sweep Animation (3.2s) -->
        <animateTransform attributeName="transform" type="rotate" 
          values="0; 26; -10; 34; 14; -6; 0" 
          dur="3.2s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- ==================== LOGO HEADLINE & READOUT ==================== -->
  <g text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
    <text x="380" y="230" fill="#FFFFFF" font-size="22" font-weight="900" letter-spacing="6" filter="url(#d-glow-mid)">DISK SCHEDULING</text>
    <text x="380" y="248" fill="#B9FFB0" font-size="11" font-weight="700" letter-spacing="3">SEEK-PATH SIMULATION · KINEMATICS ENGINE</text>
  </g>

  <!-- ==================== CYLINDER REQUEST TIMELINE TRAJECTORY ==================== -->
  <g transform="translate(85, 260)">
    <rect width="590" height="62" rx="9" fill="#061B0E" stroke="#1D602D" stroke-width="1.5"/>

    <!-- Cylinder Axis Scale Ticks -->
    <g font-family="'SF Mono', monospace" font-size="9" fill="#B9FFB0" font-weight="700" text-anchor="middle">
      <line x1="45" y1="18" x2="545" y2="18" stroke="#174A24" stroke-width="1.2"/>
      <line x1="45" y1="14" x2="45" y2="22" stroke="#39FF14" stroke-width="1.5"/>
      <text x="45" y="11">0</text>
      
      <line x1="128" y1="14" x2="128" y2="22" stroke="#247A35"/>
      <text x="128" y="11">100</text>
      
      <line x1="211" y1="14" x2="211" y2="22" stroke="#247A35"/>
      <text x="211" y="11">200</text>
      
      <line x1="295" y1="14" x2="295" y2="22" stroke="#247A35"/>
      <text x="295" y="11">300</text>
      
      <line x1="378" y1="14" x2="378" y2="22" stroke="#247A35"/>
      <text x="378" y="11">400</text>
      
      <line x1="461" y1="14" x2="461" y2="22" stroke="#247A35"/>
      <text x="461" y="11">500</text>
      
      <line x1="545" y1="14" x2="545" y2="22" stroke="#39FF14" stroke-width="1.5"/>
      <text x="545" y="11">600</text>
    </g>

    <!-- Animated Traversal Path -->
    <path id="seekPath2" d="M128 42 L198 28 L270 48 L360 30 L442 46 L524 30" 
          fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M128 42 L198 28 L270 48 L360 30 L442 46 L524 30" 
          fill="none" stroke="#39FF14" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="8 6" filter="url(#d-glow-heavy)">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.8s" repeatCount="indefinite"/>
    </path>

    <!-- Cylinder Request Node Points -->
    <g fill="#072211" stroke="#39FF14" stroke-width="2.2">
      <circle cx="128" cy="42" r="5.5"/>
      <circle cx="198" cy="28" r="5.5"/>
      <circle cx="270" cy="48" r="5.5"/>
      <circle cx="360" cy="30" r="5.5"/>
      <circle cx="442" cy="46" r="5.5"/>
      <circle cx="524" cy="30" r="5.5"/>
    </g>

    <!-- High-Intensity Traveling Seek-Head Beacon (2.8s) -->
    <circle r="6" fill="#FFFFFF" stroke="#39FF14" stroke-width="2.5" filter="url(#d-glow-heavy)">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M128 42 L198 28 L270 48 L360 30 L442 46 L524 30"/>
    </circle>
  </g>

  <!-- Bottom Status Footer -->
  <g font-family="'SF Mono', 'Fira Code', monospace" font-size="10">
    <text x="28" y="344" fill="#39FF14" font-weight="700" letter-spacing="2">● 60 FPS STORAGE KINEMATICS ACTIVE</text>
    <text x="732" y="344" text-anchor="end" fill="#8DBF91" letter-spacing="1.5">JAVASCRIPT · HTML5 CANVAS · OPERATING SYSTEMS ALGORITHMS</text>
  </g>
</svg>
<rect x=".5" y=".5" width="494" height="189" rx="12" fill="url(#b)" stroke="#1b4555"/>
<path d="M18 1H477" stroke="url(#c)" stroke-width="2"/>
<text x="22" y="29" fill="#00e5ff" font-family="monospace" font-size="12" letter-spacing="1.4">GITHUB / PROFILE STATS</text>
<text x="22" y="51" fill="#d8e7f0" font-family="Arial,sans-serif" font-size="11">Public activity overview · Priya-Ranjan-0201</text>

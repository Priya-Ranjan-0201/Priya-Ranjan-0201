<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Green Nova developer hero for Priya Ranjan</title>
  <desc id="desc">High-tech animated cyberpunk hero banner with 3D quantum orbital rings, developer HUD, live telemetry, and glowing developer monogram.</desc>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031207"/>
      <stop offset="45%" stop-color="#082A14"/>
      <stop offset="100%" stop-color="#020E05"/>
    </linearGradient>

    <linearGradient id="hero-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFAA"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>

    <linearGradient id="hero-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39FF14" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="hero-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#4ADE80" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#031207" stop-opacity="0"/>
    </radialGradient>

    <!-- Sci-Fi Light Green Grid Pattern -->
    <pattern id="hero-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#16A34A" stroke-width="0.65" opacity="0.45"/>
      <circle cx="28" cy="28" r="1" fill="#4ADE80" opacity="0.4"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="hero-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="9" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hero-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="hero-clip">
      <rect x="1" y="1" width="998" height="298" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <!-- Base Canvas Plates -->
    <rect width="1000" height="300" fill="url(#hero-bg)"/>
    <rect width="1000" height="300" fill="url(#hero-grid)"/>

    <!-- Ambient Orbital Core Glow -->
    <circle cx="790" cy="150" r="220" fill="url(#hero-core-glow)"/>

    <!-- Outer Tech Corner Accents -->
    <path d="M16 36V16H36M984 36V16H964M16 264V284H36M984 264V284H964" fill="none" stroke="#4ADE80" stroke-width="2" opacity="0.95"/>
    <circle cx="16" cy="16" r="2.5" fill="#39FF14"/>
    <circle cx="984" cy="16" r="2.5" fill="#39FF14"/>
    <circle cx="16" cy="284" r="2.5" fill="#39FF14"/>
    <circle cx="984" cy="284" r="2.5" fill="#39FF14"/>

    <!-- Top & Bottom Laser Travel Beams -->
    <path d="M0 3H1000" stroke="url(#hero-laser)" stroke-width="3" opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="1000;-1000" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0 297H1000" stroke="url(#hero-laser)" stroke-width="2" opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="-1000;1000" dur="5s" repeatCount="indefinite"/>
    </path>

    <!-- ==================== LEFT DEVELOPER IDENTITY HUD ==================== -->
    <g transform="translate(54, 46)" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace">
      <!-- Status Protocol Line -->
      <g>
        <rect x="0" y="0" width="8" height="8" fill="#39FF14">
          <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <text x="16" y="8" fill="#39FF14" font-size="11" font-weight="700" letter-spacing="2.8">PORTFOLIO SYSTEM // ONLINE</text>
        <line x1="0" y1="20" x2="420" y2="20" stroke="#22C55E" stroke-width="1.2"/>
      </g>

      <!-- Main Developer Headline Name -->
      <g transform="translate(0, 78)">
        <text x="0" y="0" fill="#39FF14" font-size="52" font-weight="900" letter-spacing="-1.5" filter="url(#hero-glow)" opacity="0.4">PRIYA RANJAN</text>
        <text x="0" y="0" fill="#FFFFFF" font-size="52" font-weight="900" letter-spacing="-1.5">PRIYA RANJAN</text>
      </g>

      <!-- Subtitle & Identity -->
      <text x="2" y="116" fill="url(#hero-neon)" font-size="16" font-weight="700" letter-spacing="2.5">DEVELOPER · SYSTEMS THINKER</text>
      <text x="2" y="146" fill="#A7F3D0" font-size="12.5" letter-spacing="1.2">
        AI / ML <tspan fill="#39FF14">✦</tspan> CYBERSECURITY <tspan fill="#39FF14">✦</tspan> SOFTWARE ENGINEERING
      </text>

      <!-- Interactive Status Badge & Mini Equalizer -->
      <g transform="translate(0, 172)">
        <rect x="0" y="0" width="260" height="32" rx="7" fill="#092814" stroke="#22C55E" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="4" fill="#39FF14">
          <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="28" y="20" fill="#FFFFFF" font-size="10.5" font-weight="700" letter-spacing="1.5">BUILDING IN PROGRESS</text>
        
        <!-- Live Micro-Equalizer Bars Inside Pill -->
        <g transform="translate(205, 16)">
          <rect x="0" y="-8" width="3" height="16" rx="1.5" fill="#39FF14">
            <animate attributeName="height" values="6;18;8;14;6" dur="1.2s" repeatCount="indefinite"/>
            <animate attributeName="y" values="-3;-9;-4;-7;-3" dur="1.2s" repeatCount="indefinite"/>
          </rect>
          <rect x="6" y="-8" width="3" height="16" rx="1.5" fill="#00FFAA">
            <animate attributeName="height" values="16;6;18;8;16" dur="1.4s" repeatCount="indefinite"/>
            <animate attributeName="y" values="-8;-3;-9;-4;-8" dur="1.4s" repeatCount="indefinite"/>
          </rect>
          <rect x="12" y="-8" width="3" height="16" rx="1.5" fill="#86EFAC">
            <animate attributeName="height" values="10;18;6;16;10" dur="1.1s" repeatCount="indefinite"/>
            <animate attributeName="y" values="-5;-9;-3;-8;-5" dur="1.1s" repeatCount="indefinite"/>
          </rect>
          <rect x="18" y="-8" width="3" height="16" rx="1.5" fill="#39FF14">
            <animate attributeName="height" values="18;8;14;6;18" dur="1.5s" repeatCount="indefinite"/>
            <animate attributeName="y" values="-9;-4;-7;-3;-9" dur="1.5s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- ==================== RIGHT 3D QUANTUM GYROSCOPE & CORE ==================== -->
    <g transform="translate(790, 148)">
      <!-- Outer Base Ring -->
      <circle r="110" fill="none" stroke="#22C55E" stroke-width="1.2" opacity="0.75"/>
      <circle r="96" fill="none" stroke="#4ADE80" stroke-width="1" stroke-dasharray="3 7" opacity="0.75"/>

      <!-- 1. Outer Compass Ring Rotating Clockwise -->
      <circle r="86" fill="none" stroke="#4ADE80" stroke-width="1.8" stroke-dasharray="8 14" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>

      <!-- 2. Middle Elliptical Gyroscope Ring (Tilted -28°) -->
      <ellipse rx="124" ry="48" fill="none" stroke="url(#hero-neon)" stroke-width="1.6" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate" from="-28" to="332" dur="16s" repeatCount="indefinite"/>
      </ellipse>

      <!-- 3. Inner Elliptical Gyroscope Ring (Tilted +45°) -->
      <ellipse rx="124" ry="48" fill="none" stroke="#00FFAA" stroke-width="1.4" opacity="0.75">
        <animateTransform attributeName="transform" type="rotate" from="45" to="-315" dur="22s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Pulsing Energy Core Ring -->
      <circle r="48" fill="#0A2E16" stroke="#22C55E" stroke-width="1.5"/>
      <circle r="34" fill="none" stroke="url(#hero-neon)" stroke-width="2.2">
        <animate attributeName="r" values="30;38;30" dur="3s" repeatCount="indefinite"/>
      </circle>

      <!-- ==================== CENTRAL DEVELOPER CREST < / > ==================== -->
      <g filter="url(#hero-glow)">
        <!-- Stylized Monogram Left Chevron -->
        <path d="M-15 -12 L-3 0 L-15 12" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Slash -->
        <path d="M4 14 L16 -14" fill="none" stroke="#39FF14" stroke-width="3.5" stroke-linecap="round"/>
        <!-- Right Chevron -->
        <path d="M22 -12 L34 0 L22 12" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Orbiting Quantum Satellite Beacons -->
      <g transform="rotate(25)">
        <circle cx="124" cy="0" r="4.5" fill="#FFFFFF" filter="url(#hero-soft-glow)">
          <animate attributeName="r" values="3.5;5.5;3.5" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </g>

      <g transform="rotate(-65)">
        <circle cx="86" cy="0" r="3.5" fill="#39FF14">
          <animate attributeName="r" values="2.5;4.5;2.5" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="12s" repeatCount="indefinite"/>
      </g>

      <g transform="rotate(110)">
        <circle cx="124" cy="0" r="3" fill="#86EFAC"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Outer Structural Border -->
    <rect x="1" y="1" width="998" height="298" rx="16" fill="none" stroke="#22C55E" stroke-width="1.5"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B0F"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B131A"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Soft Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#21262D" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Monogram Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D" fill-opacity="0.45"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseTrace {
      0% { stroke-dashoffset: 600; opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes subtleBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 0.05; }
      50% { opacity: 0.15; }
      100% { transform: translateY(200px); opacity: 0.05; }
    }
    .trace-anim {
      stroke-dasharray: 120 180;
      animation: pulseTrace 9s linear infinite;
    }
    .node-pulse {
      animation: subtleBlink 3s ease-in-out infinite;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: 5.5px;
      fill: #F0F6FC;
    }
    .text-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 2.8px;
      font-size: 11px;
      fill: #8B949E;
    }
    .text-mono {
      font-family: "SF Mono", "Segoe UI Mono", "Roboto Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      fill: #00F2FE;
    }
  </style>

  <!-- Container Box with Rounded Edges -->
  <rect x="1" y="1" width="898" height="198" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Background Grid -->
  <rect x="2" y="2" width="896" height="196" rx="13" fill="url(#grid)"/>

  <!-- Subtle Horizontal Scanline -->
  <line x1="2" y1="0" x2="898" y2="0" stroke="#00F2FE" stroke-width="1" style="animation: scanLine 8s linear infinite;"/>

  <!-- Technical Circuit / Vector Data Lines -->
  <path d="M 170 35 L 750 35 L 790 75 L 870 75" stroke="#30363D" stroke-width="1.2" fill="none"/>
  <path d="M 170 35 L 750 35 L 790 75 L 870 75" stroke="url(#cyanAccent)" stroke-width="1.5" fill="none" class="trace-anim"/>

  <path d="M 230 165 L 680 165 L 710 135 L 860 135" stroke="#30363D" stroke-width="1" fill="none"/>
  <path d="M 230 165 L 680 165 L 710 135 L 860 135" stroke="url(#cyanAccent)" stroke-width="1.2" fill="none" class="trace-anim" style="animation-duration: 12s;"/>

  <!-- Circuit Junction Nodes -->
  <circle cx="750" cy="35" r="3" fill="#0D1117" stroke="#00F2FE" stroke-width="1.5" class="node-pulse"/>
  <circle cx="790" cy="75" r="3" fill="#0D1117" stroke="#4FACFE" stroke-width="1.5"/>
  <circle cx="710" cy="135" r="2.5" fill="#0D1117" stroke="#00F2FE" stroke-width="1.5" class="node-pulse"/>

  <!-- Monogram Logo Container (Left) -->
  <g transform="translate(42, 40)">
    <!-- Hexagon/Diamond Badge Base -->
    <rect x="0" y="0" width="118" height="118" rx="16" fill="#121820" stroke="#30363D" stroke-width="1.5"/>
    <rect x="6" y="6" width="106" height="106" rx="12" fill="#0A0E13" stroke="url(#cyanAccent)" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Geometric "PR" Monogram -->
    <g transform="translate(23, 23)">
      <!-- 'P' Stem and Loop -->
      <path d="M 8 10 L 8 62 M 8 10 L 26 10 C 35 10 40 15 40 24 C 40 33 35 38 26 38 L 8 38" 
            stroke="#F0F6FC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- 'R' Leg Anchor with Cyan Accent -->
      <path d="M 24 38 L 41 62" 
            stroke="url(#cyanAccent)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#glow)"/>
      <path d="M 24 38 L 41 62" 
            stroke="#00F2FE" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Status Dot in Corner -->
    <circle cx="104" cy="14" r="3.5" fill="#38EF7D"/>
  </g>

  <!-- Typography & Identity Block -->
  <g transform="translate(195, 0)">
    <!-- System Status Monospace Pill -->
    <rect x="0" y="38" width="220" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="12" cy="49" r="3.5" fill="#38EF7D" class="node-pulse"/>
    <text x="24" y="53" class="text-mono">SYS_STATUS // ACTIVE • EXP</text>

    <!-- Main Name Title -->
    <text x="0" y="104" font-size="34" class="text-title">PRIYA RANJAN</text>

    <!-- Primary Identity Line -->
    <text x="2" y="132" class="text-sub">ENGINEER  •  BUILDER  •  PROBLEM SOLVER</text>

    <!-- Supporting Discipline Tags -->
    <g transform="translate(2, 154)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#00F2FE" font-weight="600" letter-spacing="1px">AI / ML</text>
      <text x="52" y="0" font-family="sans-serif" font-size="10" fill="#484F58">•</text>
      <text x="68" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#C9D1D9" font-weight="500" letter-spacing="1px">CYBERSECURITY</text>
      <text x="180" y="0" font-family="sans-serif" font-size="10" fill="#484F58">•</text>
      <text x="196" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#C9D1D9" font-weight="500" letter-spacing="1px">FULL-STACK SYSTEMS</text>
      <text x="345" y="0" font-family="sans-serif" font-size="10" fill="#484F58">•</text>
      <text x="361" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" fill="#8B949E" font-weight="500" letter-spacing="1px">COMPUTER VISION</text>
    </g>
  </g>

  <!-- Right Technical Accent / Frame Watermark -->
  <g transform="translate(775, 120)">
    <text x="0" y="0" class="text-mono" fill="#484F58" font-size="9" letter-spacing="1px">LAT: 2026.SYS</text>
    <text x="0" y="14" class="text-mono" fill="#30363D" font-size="9" letter-spacing="1px">PR_KERNEL // 0201</text>
    <path d="M 75 25 L 85 25 L 85 15" stroke="#00F2FE" stroke-width="1.5" fill="none" opacity="0.7"/>
  </g>
</svg>

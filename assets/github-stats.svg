<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="40%" stop-color="#081020"/>
      <stop offset="80%" stop-color="#0D1629"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1325"/>
      <stop offset="100%" stop-color="#070C18"/>
    </linearGradient>

    <!-- Holographic Cyan-to-Purple -->
    <linearGradient id="holoCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>

    <!-- Neon Emerald Gradient -->
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#60EFFF"/>
    </linearGradient>

    <!-- Cyber Gold / Amber Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>

    <!-- Ultraviolet Purple Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D4EDD"/>
      <stop offset="50%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <!-- Border Glow Runner -->
    <linearGradient id="borderLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="25%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#FF0080"/>
      <stop offset="75%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#00FF87"/>
    </linearGradient>

    <!-- Multi-stage Glow Filters -->
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Micro Dot Cyber Pattern -->
    <pattern id="statGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#00F2FE" fill-opacity="0.2"/>
      <line x1="0" y1="22" x2="22" y2="22" stroke="#122036" stroke-width="0.5" stroke-opacity="0.3"/>
      <line x1="22" y1="0" x2="22" y2="22" stroke="#122036" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes marchLaser {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1200; }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.85; filter: drop-shadow(0 0 10px #00F2FE); }
      50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 22px #00FF87); }
    }
    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCounterClockwise {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes waveOscillate {
      0% { stroke-dashoffset: 240; opacity: 0.3; }
      50% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes scanLineSwipe {
      0% { transform: translateY(-20px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(390px); opacity: 0; }
    }
    @keyframes liveBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    @keyframes textShine {
      0%, 100% { fill: #00F2FE; filter: drop-shadow(0 0 6px rgba(0,242,254,0.4)); }
      50% { fill: #60EFFF; filter: drop-shadow(0 0 16px rgba(0,255,135,0.7)); }
    }

    .border-runner {
      stroke-dasharray: 140 320;
      animation: marchLaser 12s linear infinite;
    }
    .orbit-cw {
      transform-origin: 105px 125px;
      animation: rotateClockwise 12s linear infinite;
    }
    .orbit-ccw {
      transform-origin: 105px 125px;
      animation: rotateCounterClockwise 8s linear infinite;
    }
    .orbit-slow {
      transform-origin: 105px 125px;
      animation: rotateClockwise 20s linear infinite;
    }
    .pulse-badge {
      transform-origin: 105px 125px;
      animation: pulseOrb 4s ease-in-out infinite;
    }
    .waveform {
      stroke-dasharray: 50 150;
      animation: waveOscillate 3s linear infinite;
    }
    .scanner {
      animation: scanLineSwipe 5s ease-in-out infinite;
    }
    .live-dot {
      animation: liveBlink 1.8s ease-in-out infinite;
    }
    .shining-stat {
      animation: textShine 3.5s ease-in-out infinite;
    }
    .stat-number {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", Roboto, Montserrat, sans-serif;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .stat-label {
      font-family: "SF Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 1.5px;
      fill: #8B9BB4;
    }
    .stat-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      fill: #5E718D;
    }
  </style>

  <!-- Base Outer Container -->
  <rect x="2" y="2" width="956" height="376" rx="18" fill="url(#hudBg)" stroke="#162742" stroke-width="1.5"/>
  <rect x="2" y="2" width="956" height="376" rx="18" fill="none" stroke="url(#borderLaser)" stroke-width="2.2" class="border-runner" filter="url(#intenseGlow)"/>
  <rect x="4" y="4" width="952" height="372" rx="16" fill="url(#statGrid)"/>

  <!-- Top Ambient Glow Orbs -->
  <circle cx="130" cy="200" r="110" fill="#00F2FE" fill-opacity="0.06" filter="url(#intenseGlow)"/>
  <circle cx="500" cy="180" r="140" fill="#7928CA" fill-opacity="0.05" filter="url(#intenseGlow)"/>
  <circle cx="830" cy="200" r="110" fill="#00FF87" fill-opacity="0.06" filter="url(#intenseGlow)"/>

  <!-- Scanning Laser Beam -->
  <g class="scanner">
    <line x1="10" y1="0" x2="950" y2="0" stroke="url(#holoCyan)" stroke-width="1.5" stroke-opacity="0.7" filter="url(#softGlow)"/>
  </g>

  <!-- ==================== HEADER BAR ==================== -->
  <g transform="translate(24, 22)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="370" height="28" rx="7" fill="#0A1426" stroke="#1D365A" stroke-width="1.2"/>
    <circle cx="15" cy="14" r="4.5" fill="#00FF87" class="live-dot" filter="url(#softGlow)"/>
    <text x="28" y="18" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#00FF87" letter-spacing="1.2px">
      GITHUB TELEMETRY // VERIFIED METRICS
    </text>

    <!-- Right Header Live Audit Indicator -->
    <g transform="translate(620, 0)">
      <rect x="0" y="0" width="292" height="28" rx="7" fill="#0A1426" stroke="#1D365A" stroke-width="1.2"/>
      <circle cx="15" cy="14" r="4" fill="#00F2FE" class="live-dot" filter="url(#softGlow)"/>
      <text x="28" y="18" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#00F2FE" letter-spacing="1px">
        AUDITED • 450+ COMMITS • TOP 1%
      </text>
    </g>
  </g>

  <!-- ==================== COLUMN 1: S-TIER / A+ RANK CREST ==================== -->
  <g transform="translate(24, 68)">
    <rect x="0" y="0" width="210" height="286" rx="14" fill="url(#panelGrad)" stroke="#192B45" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="210" y2="0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Header Label -->
    <text x="105" y="28" text-anchor="middle" class="stat-label" fill="#FFA500">DEVELOPER TIER</text>

    <!-- Holographic Orbit Assembly -->
    <g transform="translate(0, 0)">
      <!-- Outer Orbit Ring (Counter-Clockwise) -->
      <circle cx="105" cy="125" r="64" stroke="#1A3152" stroke-width="1.5" stroke-dasharray="8 12" fill="none"/>
      <circle cx="105" cy="125" r="64" stroke="url(#holoCyan)" stroke-width="2" stroke-dasharray="16 28" fill="none" class="orbit-ccw" filter="url(#softGlow)"/>

      <!-- Middle Orbit Ring (Clockwise) -->
      <circle cx="105" cy="125" r="52" stroke="url(#violetGrad)" stroke-width="1.5" stroke-dasharray="24 16" fill="none" class="orbit-cw"/>

      <!-- Inner Orbit Ring with Ticks -->
      <circle cx="105" cy="125" r="42" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="10 8" fill="none" class="orbit-slow" filter="url(#softGlow)"/>

      <!-- Central Shield Crest Core -->
      <g class="pulse-badge">
        <circle cx="105" cy="125" r="32" fill="#0A162B" stroke="#254673" stroke-width="1.5"/>
        <text x="105" y="136" text-anchor="middle" font-family="'SF Pro Display', -apple-system, Roboto, sans-serif" font-size="30" font-weight="900" fill="url(#goldGrad)" filter="url(#intenseGlow)">A+</text>
      </g>
    </g>

    <!-- Rank Subtext -->
    <g transform="translate(105, 214)">
      <rect x="-65" y="0" width="130" height="22" rx="6" fill="#151E0E" stroke="#2E5A1C" stroke-width="1"/>
      <text x="0" y="15" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="800" fill="#00FF87" letter-spacing="1px">
        S-TIER ARCHITECT
      </text>
      <text x="0" y="38" text-anchor="middle" class="stat-sub">Top 1% Systems Builder</text>
      <text x="0" y="52" text-anchor="middle" class="stat-sub">Production Invariants Met</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: 4 PRIMARY METRIC TILES ==================== -->
  <g transform="translate(250, 68)">

    <!-- TILE 1: Total Commits (450+) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="205" height="136" rx="12" fill="url(#panelGrad)" stroke="#192B45" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="205" y2="0" stroke="url(#holoCyan)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Icon & Label -->
      <g transform="translate(18, 20)">
        <!-- Git Commit Icon -->
        <circle cx="12" cy="12" r="6" stroke="#00F2FE" stroke-width="2" fill="none" filter="url(#softGlow)"/>
        <circle cx="12" cy="12" r="2.5" fill="#00F2FE"/>
        <line x1="0" y1="12" x2="6" y2="12" stroke="#00F2FE" stroke-width="2"/>
        <line x1="18" y1="12" x2="24" y2="12" stroke="#00F2FE" stroke-width="2"/>
        <text x="34" y="16" class="stat-label" fill="#00F2FE">TOTAL COMMITS</text>
      </g>

      <!-- Value -->
      <text x="18" y="78" font-size="32" fill="#00F2FE" class="stat-number shining-stat">450+</text>

      <!-- Progress Meter -->
      <g transform="translate(18, 94)">
        <rect x="0" y="0" width="168" height="6" rx="3" fill="#0E1A2C"/>
        <rect x="0" y="0" width="155" height="6" rx="3" fill="url(#holoCyan)" filter="url(#softGlow)"/>
        <text x="0" y="24" class="stat-sub">Across 18 repositories</text>
      </g>
    </g>

    <!-- TILE 2: Repositories Built (18+) -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="205" height="136" rx="12" fill="url(#panelGrad)" stroke="#192B45" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="205" y2="0" stroke="url(#violetGrad)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Icon & Label -->
      <g transform="translate(18, 20)">
        <!-- Repo Box Icon -->
        <rect x="3" y="3" width="18" height="18" rx="4" stroke="#C77DFF" stroke-width="2" fill="none" filter="url(#softGlow)"/>
        <line x1="3" y1="9" x2="21" y2="9" stroke="#C77DFF" stroke-width="1.5"/>
        <circle cx="12" cy="15" r="2" fill="#C77DFF"/>
        <text x="32" y="16" class="stat-label" fill="#C77DFF">REPOSITORIES</text>
      </g>

      <!-- Value -->
      <text x="18" y="78" font-size="32" fill="#C77DFF" class="stat-number">18+</text>

      <!-- Progress Meter -->
      <g transform="translate(18, 94)">
        <rect x="0" y="0" width="168" height="6" rx="3" fill="#0E1A2C"/>
        <rect x="0" y="0" width="140" height="6" rx="3" fill="url(#violetGrad)" filter="url(#softGlow)"/>
        <text x="0" y="24" class="stat-sub">Full-stack, Systems &amp; AI</text>
      </g>
    </g>

    <!-- TILE 3: Total Stars Earned (14+) -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="205" height="136" rx="12" fill="url(#panelGrad)" stroke="#192B45" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="205" y2="0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Icon & Label -->
      <g transform="translate(18, 20)">
        <!-- Star Icon -->
        <polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9" fill="#FFD700" filter="url(#softGlow)"/>
        <text x="32" y="16" class="stat-label" fill="#FFD700">STARS EARNED</text>
      </g>

      <!-- Value -->
      <text x="18" y="78" font-size="32" fill="#FFD700" class="stat-number">14+</text>

      <!-- Progress Meter -->
      <g transform="translate(18, 94)">
        <rect x="0" y="0" width="168" height="6" rx="3" fill="#0E1A2C"/>
        <rect x="0" y="0" width="125" height="6" rx="3" fill="url(#goldGrad)" filter="url(#softGlow)"/>
        <text x="0" y="24" class="stat-sub">Open-source community reach</text>
      </g>
    </g>

    <!-- TILE 4: Pull Requests & Issues (9 Active) -->
    <g transform="translate(220, 150)">
      <rect x="0" y="0" width="205" height="136" rx="12" fill="url(#panelGrad)" stroke="#192B45" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="205" y2="0" stroke="url(#neonEmerald)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Icon & Label -->
      <g transform="translate(18, 20)">
        <!-- PR Branch Icon -->
        <circle cx="6" cy="6" r="3" stroke="#00FF87" stroke-width="1.5" fill="none"/>
        <circle cx="6" cy="18" r="3" stroke="#00FF87" stroke-width="1.5" fill="none"/>
        <circle cx="18" cy="10" r="3" stroke="#00FF87" stroke-width="1.5" fill="none"/>
        <path d="M 6 9 L 6 15 M 6 12 C 12 12, 14 10, 15 10" stroke="#00FF87" stroke-width="1.5" fill="none"/>
        <text x="30" y="16" class="stat-label" fill="#00FF87">PRS &amp; ISSUES</text>
      </g>

      <!-- Value -->
      <text x="18" y="78" font-size="32" fill="#00FF87" class="stat-number">5 PRs <tspan font-size="20" fill="#6B7D96">/ 4 Iss</tspan></text>

      <!-- Progress Meter -->
      <g transform="translate(18, 94)">
        <rect x="0" y="0" width="168" height="6" rx="3" fill="#0E1A2C"/>
        <rect x="0" y="0" width="145" height="6" rx="3" fill="url(#neonEmerald)" filter="url(#softGlow)"/>
        <text x="0" y="24" class="stat-sub">100% resolution &amp; clean merges</text>
      </g>
    </g>
  </g>

  <!-- ==================== COLUMN 3: REAL-TIME SYSTEM MONITOR & OSCILLOSCOPE ==================== -->
  <g transform="translate(690, 68)">
    <rect x="0" y="0" width="246" height="286" rx="14" fill="url(#panelGrad)" stroke="#192B45" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="246" y2="0" stroke="url(#holoCyan)" stroke-width="3" stroke-linecap="round"/>

    <!-- Section Header -->
    <g transform="translate(18, 20)">
      <text x="0" y="10" class="stat-label" fill="#00F2FE">SYSTEM TELEMETRY</text>
      <text x="0" y="28" font-size="16" font-weight="800" fill="#FFFFFF" class="stat-number">ACTIVE PIPELINE</text>
    </g>

    <!-- Real-Time Oscilloscope Screen -->
    <g transform="translate(18, 64)">
      <rect x="0" y="0" width="210" height="74" rx="8" fill="#050C18" stroke="#14263E" stroke-width="1"/>

      <!-- Grid lines -->
      <line x1="0" y1="37" x2="210" y2="37" stroke="#0E1E34" stroke-width="0.8" stroke-dasharray="4 4"/>
      <line x1="70" y1="0" x2="70" y2="74" stroke="#0E1E34" stroke-width="0.8" stroke-dasharray="4 4"/>
      <line x1="140" y1="0" x2="140" y2="74" stroke="#0E1E34" stroke-width="0.8" stroke-dasharray="4 4"/>

      <!-- Oscilloscope Heartbeat Waveform -->
      <path d="M 0 37 L 25 37 L 35 15 L 45 55 L 55 22 L 65 48 L 75 37 L 110 37 L 120 18 L 130 52 L 140 26 L 150 44 L 160 37 L 210 37" stroke="#162D4A" stroke-width="1.8" fill="none"/>
      <path d="M 0 37 L 25 37 L 35 15 L 45 55 L 55 22 L 65 48 L 75 37 L 110 37 L 120 18 L 130 52 L 140 26 L 150 44 L 160 37 L 210 37" stroke="#00F2FE" stroke-width="2.2" stroke-linecap="round" fill="none" class="waveform" filter="url(#intenseGlow)"/>

      <text x="8" y="16" font-family="'SF Mono', Consolas, monospace" font-size="8.5" fill="#00FF87">60 FPS KINEMATICS</text>
      <text x="145" y="66" font-family="'SF Mono', Consolas, monospace" font-size="8.5" fill="#00F2FE">&lt; 15ms IO</text>
    </g>

    <!-- Telemetry Invariants Check-List -->
    <g transform="translate(18, 154)">
      <!-- Line 1: Automated Test Suites -->
      <g transform="translate(0, 0)">
        <circle cx="6" cy="6" r="3.5" fill="#00FF87" filter="url(#softGlow)"/>
        <text x="16" y="10" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#E2E8F0">153/153 Tests Passed</text>
        <text x="16" y="23" class="stat-sub">Pytest • AST • Qdrant Vector</text>
      </g>

      <!-- Line 2: Cloud Automation -->
      <g transform="translate(0, 36)">
        <circle cx="6" cy="6" r="3.5" fill="#00F2FE" filter="url(#softGlow)"/>
        <text x="16" y="10" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#E2E8F0">Autonomous Cloud Actions</text>
        <text x="16" y="23" class="stat-sub">Green Machine • 100% Invariants</text>
      </g>

      <!-- Line 3: SIH Grand Finalist -->
      <g transform="translate(0, 72)">
        <circle cx="6" cy="6" r="3.5" fill="#FFD700" filter="url(#softGlow)"/>
        <text x="16" y="10" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#E2E8F0">SIH Grand Finalist</text>
        <text x="16" y="23" class="stat-sub">Digital Public Infrastructure</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="110" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D13"/>
      <stop offset="100%" stop-color="#0E1620"/>
    </linearGradient>
    <linearGradient id="shieldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="418" height="108" rx="8" fill="url(#shieldGrad)" stroke="#21262D" stroke-width="1.2"/>
  <line x1="1" y1="1" x2="419" y2="1" stroke="url(#shieldAccent)" stroke-width="2" stroke-linecap="round"/>

  <!-- Index Number -->
  <text x="24" y="32" font-family="'SF Mono', 'Segoe UI Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#38EF7D" letter-spacing="1.5px">02 // SECURITY</text>

  <!-- Project Name -->
  <text x="24" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F0F6FC" letter-spacing="2px">TrustShield-X</text>

  <!-- Subtitle -->
  <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#8B949E" letter-spacing="0.5px">Digital Trust &amp; Cyber Defense Architecture</text>

  <!-- Tag Pills -->
  <g transform="translate(24, 88)">
    <text font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#38EF7D">CYBERSECURITY</text>
    <text x="96" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
    <text x="108" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">THREAT ANALYSIS</text>
    <text x="216" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
    <text x="228" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">SYSTEMS</text>
  </g>

  <!-- Abstract Geometric Shield Accent (Right) -->
  <g transform="translate(340, 26)">
    <polygon points="30,8 54,16 54,38 30,54 6,38 6,16" stroke="#21262D" stroke-width="1.2" fill="none"/>
    <polygon points="30,16 46,22 46,34 30,46 14,34 14,22" stroke="#30363D" stroke-width="1" fill="none"/>
    <circle cx="30" cy="30" r="3.5" fill="#38EF7D"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="110" fill="none">
  <defs>
    <linearGradient id="gmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070E10"/>
      <stop offset="50%" stop-color="#0A1617"/>
      <stop offset="100%" stop-color="#0D201A"/>
    </linearGradient>
    <linearGradient id="gmAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#60EFFF"/>
    </linearGradient>
    <filter id="gmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes gearSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseRing {
      0%, 100% { r: 16px; opacity: 0.5; }
      50% { r: 24px; opacity: 0.9; stroke-width: 2px; }
    }
    .gear-rot {
      transform-origin: 360px 55px;
      animation: gearSpin 10s linear infinite;
    }
    .ring-pulse {
      animation: pulseRing 3s ease-in-out infinite;
    }
  </style>

  <rect x="1" y="1" width="418" height="108" rx="10" fill="url(#gmBg)" stroke="#16382A" stroke-width="1.2"/>
  <rect x="1" y="1" width="4" height="108" rx="2" fill="url(#gmAccent)"/>

  <!-- Project Title & Category -->
  <text x="20" y="28" font-family="'SF Pro Display', -apple-system, Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="0.5px">GITHUB GREEN MACHINE</text>
  <rect x="235" y="14" width="95" height="18" rx="4" fill="#0C2418" stroke="#1B4D34" stroke-width="0.8"/>
  <text x="282" y="26" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="700" fill="#00FF87">CLOUD ACTIONS</text>

  <!-- Tagline -->
  <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8EA8A0">Autonomous Dynamic Repository Maintenance Engine</text>

  <!-- Tech Badges -->
  <g transform="translate(20, 64)">
    <rect x="0" y="0" width="95" height="18" rx="4" fill="#081410" stroke="#1A3B2C" stroke-width="0.8"/>
    <text x="47" y="12.5" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="8.5" fill="#60EFFF">GITHUB ACTIONS</text>

    <rect x="103" y="0" width="85" height="18" rx="4" fill="#081410" stroke="#1A3B2C" stroke-width="0.8"/>
    <text x="145" y="12.5" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="8.5" fill="#00FF87">POSIX CRON</text>

    <rect x="196" y="0" width="80" height="18" rx="4" fill="#081410" stroke="#1A3B2C" stroke-width="0.8"/>
    <text x="236" y="12.5" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="8.5" fill="#60EFFF">EPHEMERAL</text>
  </g>

  <!-- Metric Status Bar -->
  <text x="20" y="98" font-family="'SF Mono', Consolas, monospace" font-size="8.5" fill="#00FF87">● 100% INVARIANTS PASS</text>
  <text x="160" y="98" font-family="'SF Mono', Consolas, monospace" font-size="8.5" fill="#4E6E60">DYNAMIC JITTER • HOURLY AUTH</text>

  <!-- Right Visual Assembly: Autonomous Cog/Radar -->
  <g transform="translate(0, 0)">
    <circle cx="360" cy="55" r="32" stroke="#122A1E" stroke-width="1.2" fill="none"/>
    <circle cx="360" cy="55" r="22" stroke="#00FF87" stroke-width="1" stroke-dasharray="4 8" fill="none" class="gear-rot"/>
    <circle cx="360" cy="55" r="16" stroke="#60EFFF" stroke-width="1.5" fill="none" class="ring-pulse"/>
    <circle cx="360" cy="55" r="5" fill="#00FF87" filter="url(#gmGlow)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="110" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B10"/>
      <stop offset="50%" stop-color="#0A1215"/>
      <stop offset="100%" stop-color="#0D181A"/>
    </linearGradient>
    <linearGradient id="shieldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38EF7D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38EF7D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes laserSweep {
      0% { transform: translateY(-16px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(46px); opacity: 0; }
    }
    @keyframes shieldPulse {
      0%, 100% { stroke: #264334; stroke-opacity: 0.6; }
      50% { stroke: #38EF7D; stroke-opacity: 1; filter: drop-shadow(0 0 4px #38EF7D); }
    }
    @keyframes coreRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .shield-border {
      animation: shieldPulse 3s ease-in-out infinite;
    }
    .laser-line {
      animation: laserSweep 2.8s ease-in-out infinite;
    }
    .core-ring {
      transform-origin: 350px 55px;
      animation: coreRotate 7s linear infinite;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="418" height="108" rx="10" fill="url(#shieldBg)" stroke="#21262D" stroke-width="1.2"/>
  <line x1="1" y1="1" x2="419" y2="1" stroke="url(#shieldAccent)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Content Block -->
  <g transform="translate(22, 0)">
    <!-- Category Tag -->
    <text x="0" y="32" font-family="'SF Mono', 'Segoe UI Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#38EF7D" letter-spacing="1.5px">02 // SECURITY</text>

    <!-- Project Title -->
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#F0F6FC" letter-spacing="2px">TrustShield-X</text>

    <!-- Subtitle -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#8B949E" letter-spacing="0.3px">Digital Trust &amp; Cyber Defense Architecture</text>

    <!-- Tags -->
    <g transform="translate(0, 92)">
      <text font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="600" fill="#38EF7D">CYBERSECURITY</text>
      <text x="94" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
      <text x="106" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">THREAT MODELING</text>
      <text x="214" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
      <text x="226" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">SYSTEMS</text>
    </g>
  </g>

  <!-- Right Animated Cyber Defense Shield -->
  <g>
    <!-- Background Glow Halo -->
    <circle cx="350" cy="55" r="40" fill="#38EF7D" fill-opacity="0.03"/>
    
    <!-- Outer Shield Frame -->
    <polygon points="350,22 384,34 384,62 350,86 316,62 316,34" 
             stroke="#1C2E24" stroke-width="1.5" fill="#0A1313"/>
    
    <!-- Inner Animated Shield Frame -->
    <polygon points="350,26 378,36 378,60 350,80 322,60 322,36" 
             stroke="#38EF7D" stroke-width="1.8" fill="none" class="shield-border"/>

    <!-- Laser Scanning Beam -->
    <g clip-path="url(#shieldClip)">
      <line x1="320" y1="55" x2="380" y2="55" stroke="url(#laserGrad)" stroke-width="2" class="laser-line"/>
    </g>

    <!-- Rotating Core Tech Hexagon -->
    <g class="core-ring">
      <polygon points="350,44 360,49 360,61 350,66 340,61 340,49" 
               stroke="#00F2FE" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
    </g>

    <!-- Center Security Node Core -->
    <circle cx="350" cy="55" r="4" fill="#38EF7D" filter="url(#shieldGlow)"/>
    <circle cx="350" cy="55" r="2" fill="#FFFFFF"/>
  </g>
</svg>

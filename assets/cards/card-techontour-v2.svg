<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="110" fill="none">
  <defs>
    <linearGradient id="tourBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B10"/>
      <stop offset="50%" stop-color="#09111A"/>
      <stop offset="100%" stop-color="#0C1724"/>
    </linearGradient>
    <linearGradient id="tourAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <filter id="tourGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes needlePivot {
      0% { transform: rotate(-35deg); }
      35% { transform: rotate(50deg); }
      70% { transform: rotate(-15deg); }
      100% { transform: rotate(-35deg); }
    }
    @keyframes orbitNodeSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes beaconPulse {
      0% { r: 5px; opacity: 0.9; }
      100% { r: 32px; opacity: 0; }
    }
    .compass-needle {
      transform-origin: 350px 55px;
      animation: needlePivot 6s ease-in-out infinite;
    }
    .satellite-orbit {
      transform-origin: 350px 55px;
      animation: orbitNodeSpin 5s linear infinite;
    }
    .beacon-wave {
      animation: beaconPulse 2.8s ease-out infinite;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="418" height="108" rx="10" fill="url(#tourBg)" stroke="#21262D" stroke-width="1.2"/>
  <line x1="1" y1="1" x2="419" y2="1" stroke="url(#tourAccent)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Content Block -->
  <g transform="translate(22, 0)">
    <!-- Category Tag -->
    <text x="0" y="32" font-family="'SF Mono', 'Segoe UI Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#4FACFE" letter-spacing="1.5px">03 // FULL-STACK</text>

    <!-- Project Title -->
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#F0F6FC" letter-spacing="2px">TECH-ON-TOUR</text>

    <!-- Subtitle -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#8B949E" letter-spacing="0.3px">Intelligent Travel &amp; Search Graph Engine</text>

    <!-- Tags -->
    <g transform="translate(0, 92)">
      <text font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="600" fill="#4FACFE">SEARCH GRAPH</text>
      <text x="86" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
      <text x="98" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">DATA MODELING</text>
      <text x="188" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
      <text x="200" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">FULL-STACK</text>
    </g>
  </g>

  <!-- Right Animated Navigation Compass & Graph Beacon -->
  <g>
    <!-- Background Halo -->
    <circle cx="350" cy="55" r="40" fill="#4FACFE" fill-opacity="0.03"/>
    
    <!-- Outer Dial with Degree Markers -->
    <circle cx="350" cy="55" r="35" stroke="#1A2533" stroke-width="1.2" fill="#0A1017"/>
    <circle cx="350" cy="55" r="35" stroke="#4FACFE" stroke-width="1.5" stroke-dasharray="4 14" stroke-opacity="0.5" fill="none"/>
    
    <!-- Inner Coordinate Ring -->
    <circle cx="350" cy="55" r="24" stroke="#1E2E42" stroke-width="1" fill="none"/>

    <!-- Beacon Pulse Wave -->
    <circle cx="350" cy="55" r="8" stroke="#4FACFE" fill="none" class="beacon-wave"/>

    <!-- Orbiting Satellite Node -->
    <g class="satellite-orbit">
      <circle cx="350" cy="20" r="3.5" fill="#00F2FE" filter="url(#tourGlow)"/>
    </g>

    <!-- Animated Pivoting Compass Needle -->
    <g class="compass-needle">
      <!-- North Pointer (Cyan) -->
      <polygon points="350,25 356,52 350,55 344,52" fill="#00F2FE" filter="url(#tourGlow)"/>
      <!-- South Pointer (Muted) -->
      <polygon points="350,85 356,58 350,55 344,58" fill="#253A4E"/>
      <!-- Center Pivot Pin -->
      <circle cx="350" cy="55" r="4" fill="#0B131C" stroke="#4FACFE" stroke-width="1.5"/>
      <circle cx="350" cy="55" r="1.8" fill="#FFFFFF"/>
    </g>
  </g>
</svg>

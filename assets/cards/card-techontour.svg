<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="110" fill="none">
  <defs>
    <linearGradient id="tourGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D13"/>
      <stop offset="100%" stop-color="#0E1620"/>
    </linearGradient>
    <linearGradient id="tourAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="418" height="108" rx="8" fill="url(#tourGrad)" stroke="#21262D" stroke-width="1.2"/>
  <line x1="1" y1="1" x2="419" y2="1" stroke="url(#tourAccent)" stroke-width="2" stroke-linecap="round"/>

  <!-- Index Number -->
  <text x="24" y="32" font-family="'SF Mono', 'Segoe UI Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#4FACFE" letter-spacing="1.5px">03 // FULL-STACK</text>

  <!-- Project Name -->
  <text x="24" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F0F6FC" letter-spacing="2px">TECH-ON-TOUR</text>

  <!-- Subtitle -->
  <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#8B949E" letter-spacing="0.5px">Modern Technical Web Platform &amp; Experience</text>

  <!-- Tag Pills -->
  <g transform="translate(24, 88)">
    <text font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#4FACFE">FULL-STACK</text>
    <text x="70" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
    <text x="82" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">WEB SYSTEMS</text>
    <text x="160" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
    <text x="172" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">UI/UX INTERACTIVE</text>
  </g>

  <!-- Abstract Geometric Compass/Route Accent (Right) -->
  <g transform="translate(340, 26)">
    <circle cx="30" cy="28" r="24" stroke="#21262D" stroke-width="1.2" fill="none"/>
    <path d="M 16 36 L 40 18 L 34 40 Z" stroke="#30363D" stroke-width="1" fill="#12171E"/>
    <circle cx="30" cy="28" r="3" fill="#4FACFE"/>
  </g>
</svg>

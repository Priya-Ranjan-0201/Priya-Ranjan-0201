<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="110" fill="none">
  <defs>
    <linearGradient id="prioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D13"/>
      <stop offset="100%" stop-color="#0E1620"/>
    </linearGradient>
    <linearGradient id="prioAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E62"/>
      <stop offset="100%" stop-color="#FF9966"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="418" height="108" rx="8" fill="url(#prioGrad)" stroke="#21262D" stroke-width="1.2"/>
  <line x1="1" y1="1" x2="419" y2="1" stroke="url(#prioAccent)" stroke-width="2" stroke-linecap="round"/>

  <!-- Index Number -->
  <text x="24" y="32" font-family="'SF Mono', 'Segoe UI Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#FF7B72" letter-spacing="1.5px">05 // HEALTH-AI</text>

  <!-- Project Name -->
  <text x="24" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F0F6FC" letter-spacing="2px">Priocardix-AI</text>

  <!-- Subtitle -->
  <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#8B949E" letter-spacing="0.5px">Cardiac Assessment &amp; Predictive ML Exploration</text>

  <!-- Tag Pills -->
  <g transform="translate(24, 88)">
    <text font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#FF7B72">PREDICTIVE ML</text>
    <text x="96" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
    <text x="108" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">HEALTHCARE AI</text>
    <text x="198" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
    <text x="210" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">DATA MODELING</text>
  </g>

  <!-- Abstract Geometric ECG Accent (Right) -->
  <g transform="translate(330, 32)">
    <path d="M 0 24 L 20 24 L 28 8 L 36 40 L 44 18 L 50 28 L 56 24 L 75 24" 
          stroke="#FF7B72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
    <circle cx="28" cy="8" r="2.5" fill="#FF7B72"/>
  </g>
</svg>

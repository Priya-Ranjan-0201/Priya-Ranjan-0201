<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="110" fill="none">
  <defs>
    <linearGradient id="cvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D13"/>
      <stop offset="100%" stop-color="#0E1620"/>
    </linearGradient>
    <linearGradient id="cvAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#38EF7D"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="418" height="108" rx="8" fill="url(#cvGrad)" stroke="#21262D" stroke-width="1.2"/>
  <line x1="1" y1="1" x2="419" y2="1" stroke="url(#cvAccent)" stroke-width="2" stroke-linecap="round"/>

  <!-- Index Number -->
  <text x="24" y="32" font-family="'SF Mono', 'Segoe UI Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#00F2FE" letter-spacing="1.5px">04 // VISION</text>

  <!-- Project Name -->
  <text x="24" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F0F6FC" letter-spacing="2px">HRCV-</text>

  <!-- Subtitle -->
  <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#8B949E" letter-spacing="0.5px">Human Recognition &amp; Computer Vision</text>

  <!-- Tag Pills -->
  <g transform="translate(24, 88)">
    <text font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#00F2FE">COMPUTER VISION</text>
    <text x="106" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
    <text x="118" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">IMAGE PROCESSING</text>
    <text x="230" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
    <text x="242" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">PYTHON</text>
  </g>

  <!-- Abstract Geometric Bounding Box Accent (Right) -->
  <g transform="translate(340, 26)">
    <!-- Bounding Box Targeting Reticle -->
    <path d="M 12 18 L 12 10 L 20 10" stroke="#00F2FE" stroke-width="1.5" fill="none"/>
    <path d="M 48 10 L 56 10 L 56 18" stroke="#00F2FE" stroke-width="1.5" fill="none"/>
    <path d="M 12 40 L 12 48 L 20 48" stroke="#00F2FE" stroke-width="1.5" fill="none"/>
    <path d="M 48 48 L 56 48 L 56 40" stroke="#00F2FE" stroke-width="1.5" fill="none"/>
    <circle cx="34" cy="29" r="10" stroke="#30363D" stroke-width="1" fill="none"/>
    <circle cx="34" cy="29" r="2.5" fill="#38EF7D"/>

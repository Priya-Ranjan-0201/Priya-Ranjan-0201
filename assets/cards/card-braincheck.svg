<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="110" fill="none">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D13"/>
      <stop offset="100%" stop-color="#0E1620"/>
    </linearGradient>
    <linearGradient id="brainAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D2A8FF"/>
      <stop offset="100%" stop-color="#A371F7"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="418" height="108" rx="8" fill="url(#brainGrad)" stroke="#21262D" stroke-width="1.2"/>
  <line x1="1" y1="1" x2="419" y2="1" stroke="url(#brainAccent)" stroke-width="2" stroke-linecap="round"/>

  <!-- Index Number -->
  <text x="24" y="32" font-family="'SF Mono', 'Segoe UI Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#D2A8FF" letter-spacing="1.5px">06 // DIAGNOSTICS</text>

  <!-- Project Name -->
  <text x="24" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F0F6FC" letter-spacing="2px">BrainCheck</text>

  <!-- Subtitle -->
  <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#8B949E" letter-spacing="0.5px">Cognitive &amp; Neurological Assessment Modeling</text>

  <!-- Tag Pills -->
  <g transform="translate(24, 88)">
    <text font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#D2A8FF">DIAGNOSTICS</text>
    <text x="80" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
    <text x="92" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">NEURAL EXPLORATION</text>
    <text x="220" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
    <text x="232" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">SYSTEMS</text>
  </g>

  <!-- Abstract Neural Node Web Accent (Right) -->
  <g transform="translate(340, 26)">
    <line x1="15" y1="20" x2="35" y2="12" stroke="#30363D" stroke-width="1"/>
    <line x1="35" y1="12" x2="52" y2="28" stroke="#30363D" stroke-width="1"/>
    <line x1="15" y1="20" x2="32" y2="44" stroke="#30363D" stroke-width="1"/>
    <line x1="32" y1="44" x2="52" y2="28" stroke="#30363D" stroke-width="1"/>
    <circle cx="15" cy="20" r="3.5" fill="#D2A8FF"/>
    <circle cx="35" cy="12" r="3" fill="#A371F7"/>
    <circle cx="52" cy="28" r="4" fill="#D2A8FF"/>
    <circle cx="32" cy="44" r="3" fill="#A371F7"/>
  </g>
</svg>

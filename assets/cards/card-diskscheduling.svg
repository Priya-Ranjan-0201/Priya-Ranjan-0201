<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="110" fill="none">
  <defs>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D13"/>
      <stop offset="100%" stop-color="#0E1620"/>
    </linearGradient>
    <linearGradient id="diskAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79C0FF"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="418" height="108" rx="8" fill="url(#diskGrad)" stroke="#21262D" stroke-width="1.2"/>
  <line x1="1" y1="1" x2="419" y2="1" stroke="url(#diskAccent)" stroke-width="2" stroke-linecap="round"/>

  <!-- Index Number -->
  <text x="24" y="32" font-family="'SF Mono', 'Segoe UI Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#79C0FF" letter-spacing="1.5px">07 // SYSTEMS</text>

  <!-- Project Name -->
  <text x="24" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F0F6FC" letter-spacing="1.5px">Disk Scheduling</text>

  <!-- Subtitle -->
  <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#8B949E" letter-spacing="0.5px">OS Head Optimization Engine (FCFS, SCAN, C-LOOK)</text>

  <!-- Tag Pills -->
  <g transform="translate(24, 88)">
    <text font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#79C0FF">OS ALGORITHMS</text>
    <text x="96" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
    <text x="108" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">SYSTEM ARCHITECTURE</text>
    <text x="238" font-family="sans-serif" font-size="9" fill="#484F58">•</text>
    <text x="250" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8B949E">C / PYTHON</text>
  </g>

  <!-- Abstract Hard Disk Platter Accent (Right) -->
  <g transform="translate(340, 26)">
    <circle cx="30" cy="28" r="26" stroke="#21262D" stroke-width="1.2" fill="none"/>
    <circle cx="30" cy="28" r="16" stroke="#30363D" stroke-width="1" fill="none"/>
    <circle cx="30" cy="28" r="7" fill="#161B22" stroke="#79C0FF" stroke-width="1.2"/>
    <!-- Head Arm -->
    <line x1="8" y1="8" x2="26" y2="24" stroke="#79C0FF" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="8" cy="8" r="2.5" fill="#58A6FF"/>
  </g>
</svg>

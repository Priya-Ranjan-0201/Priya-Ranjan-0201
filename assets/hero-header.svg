<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" fill="none">
  <defs>
    <!-- Deep Obsidian Titanium Background -->
    <linearGradient id="titaniumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>

    <!-- Refined Ice Cyan Accent Gradient -->
    <linearGradient id="iceCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Elegant Single-Tone Cyan Border Runner -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Subtle Non-blinding Glow Filter -->
    <filter id="cleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Minimal Micro Dot Matrix -->
    <pattern id="dotMatrix" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#38BDF8" fill-opacity="0.14"/>
    </pattern>

    <!-- Technical Radar Sweep Gradient -->
    <linearGradient id="radarCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes borderGlide {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 700; }
    }
    @keyframes radarRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes counterRotate {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes liveSignal {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    @keyframes pulseRing {
      0% { r: 4px; opacity: 1; stroke-width: 2px; }
      70% { opacity: 0.35; }
      100% { r: 24px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes busPulse {
      0% { stroke-dashoffset: 500; opacity: 0.15; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.15; }
    }

    .border-runner {
      stroke-dasharray: 100 240;
      animation: borderGlide 14s linear infinite;
    }
    .orbit-cw {
      transform-origin: 840px 130px;
      animation: radarRotate 10s linear infinite;
    }
    .orbit-ccw {
      transform-origin: 840px 130px;
      animation: counterRotate 15s linear infinite;
    }
    .monogram-cw {
      transform-origin: 105px 130px;
      animation: radarRotate 12s linear infinite;
    }
    .signal-blink {
      animation: liveSignal 2s ease-in-out infinite;
    }
    .sonar-ping {
      animation: pulseRing 2.4s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .bus-stream {
      stroke-dasharray: 80 180;
      animation: busPulse 7s linear infinite;
    }
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", Roboto, Montserrat, sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      fill: #F8FAFC;
    }
    .hero-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #64748B;
    }
    .pill-label {
      font-family: "SF Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
      font-weight: 700;
      font-size: 9.5px;
      letter-spacing: 1px;
    }
  </style>

  <!-- Base Card Frame -->
  <rect x="2" y="2" width="956" height="256" rx="16" fill="url(#titaniumBg)" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="2" y="2" width="956" height="256" rx="16" fill="none" stroke="url(#cyanBorder)" stroke-width="1.8" class="border-runner"/>
  <rect x="4" y="4" width="952" height="252" rx="14" fill="url(#dotMatrix)"/>

  <!-- High-Speed Data Traces (Ice Cyan) -->
  <path d="M 190 36 L 730 36 L 760 64 L 940 64" stroke="#162234" stroke-width="1.2" fill="none"/>
  <path d="M 190 36 L 730 36 L 760 64 L 940 64" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" fill="none" class="bus-stream"/>

  <path d="M 210 224 L 710 224 L 740 196 L 940 196" stroke="#162234" stroke-width="1.2" fill="none"/>
  <path d="M 210 224 L 710 224 L 740 196 L 940 196" stroke="#0EA5E9" stroke-width="1.8" stroke-linecap="round" fill="none" class="bus-stream" style="animation-delay: 3s;"/>

  <!-- ==================== LEFT: MONOGRAM LOGO (PR) ==================== -->
  <g transform="translate(42, 50)">
    <!-- Rotating Dashed Orbit Ring Around Monogram -->
    <circle cx="63" cy="63" r="66" stroke="#1E293B" stroke-width="1" stroke-dasharray="8 12" fill="none"/>
    <circle cx="63" cy="63" r="66" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="16 28" fill="none" class="monogram-cw"/>

    <!-- Octagonal Card Base -->
    <rect x="4" y="4" width="118" height="118" rx="20" fill="#0C1220" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="8" y="8" width="110" height="110" rx="16" fill="#080D18" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Geometric "PR" Monogram -->
    <g transform="translate(14, 12)">
      <!-- Letter 'P' -->
      <path d="M 22 24 L 22 80" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M 22 24 L 43 24 C 54 24 60 30 60 40 C 60 50 54 55 43 55 L 22 55" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Letter 'R' -->
      <path d="M 64 24 L 64 80" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M 64 24 L 84 24 C 95 24 100 30 100 40 C 100 50 95 55 84 55 L 64 55" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 81 55 L 101 80" stroke="url(#iceCyan)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#cleanGlow)"/>
    </g>

    <!-- Bottom Status Node inside Monogram -->
    <g transform="translate(16, 96)">
      <rect x="0" y="0" width="94" height="18" rx="9" fill="#0E1726" stroke="#1E293B" stroke-width="1"/>
      <circle cx="10" cy="9" r="3.5" fill="#10B981" class="signal-blink"/>
      <circle cx="10" cy="9" r="3.5" stroke="#10B981" fill="none" class="sonar-ping"/>
      <text x="21" y="12.5" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="700" fill="#10B981" letter-spacing="0.5px">SYS // ACTIVE</text>
    </g>
  </g>

  <!-- ==================== CENTER: IDENTITY & DISCIPLINE PILLS ==================== -->
  <g transform="translate(216, 0)">
    <!-- Top Role Ribbon -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="280" height="24" rx="12" fill="#0C1424" stroke="#1E293B" stroke-width="1"/>
      <circle cx="13" cy="12" r="3.5" fill="#38BDF8" class="signal-blink"/>
      <text x="26" y="15.5" class="pill-label" fill="#38BDF8">SOFTWARE ENGINEER &amp; ARCHITECT</text>
    </g>

    <!-- Primary Name -->
    <text x="0" y="112" font-size="39" class="hero-title">PRIYA RANJAN</text>

    <!-- Architectural Role Statement -->
    <text x="2" y="139" font-size="12" class="hero-sub">ENGINEER  •  SYSTEMS BUILDER  •  PROBLEM SOLVER</text>

    <!-- Core Discipline Badges (Clean, Sophisticated Dark Glass) -->
    <g transform="translate(2, 162)">
      <!-- Badge 1: Systems & OS -->
      <g>
        <rect x="0" y="0" width="136" height="25" rx="6" fill="#0A111F" stroke="#1E293B" stroke-width="1"/>
        <circle cx="12" cy="12.5" r="3" fill="#38BDF8"/>
        <text x="22" y="16" class="pill-label" fill="#CBD5E1">SYSTEMS &amp; OS</text>
      </g>

      <!-- Badge 2: AI & Neural -->
      <g transform="translate(144, 0)">
        <rect x="0" y="0" width="140" height="25" rx="6" fill="#0A111F" stroke="#1E293B" stroke-width="1"/>
        <circle cx="12" cy="12.5" r="3" fill="#38BDF8"/>
        <text x="22" y="16" class="pill-label" fill="#CBD5E1">AI &amp; DEEP LEARNING</text>
      </g>

      <!-- Badge 3: Cyber Defense -->
      <g transform="translate(292, 0)">
        <rect x="0" y="0" width="144" height="25" rx="6" fill="#0A111F" stroke="#1E293B" stroke-width="1"/>
        <circle cx="12" cy="12.5" r="3" fill="#10B981"/>
        <text x="22" y="16" class="pill-label" fill="#CBD5E1">CYBER DEFENSE</text>
      </g>

      <!-- Badge 4: Full-Stack Cloud -->
      <g transform="translate(444, 0)">
        <rect x="0" y="0" width="120" height="25" rx="6" fill="#0A111F" stroke="#1E293B" stroke-width="1"/>
        <circle cx="12" cy="12.5" r="3" fill="#38BDF8"/>
        <text x="22" y="16" class="pill-label" fill="#CBD5E1">FULL-STACK</text>
      </g>
    </g>

    <!-- Engineering Philosophy Quote -->
    <text x="3" y="214" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="500" fill="#64748B" letter-spacing="0.5px">
      <tspan fill="#38BDF8">&gt;</tspan> Building systems that solve tangible, real-world problems from first principles.
    </text>
  </g>

  <!-- ==================== RIGHT: MINIMAL RADAR HUD ==================== -->
  <g transform="translate(765, 46)">
    <!-- Base Hologram Box -->
    <rect x="0" y="0" width="152" height="166" rx="14" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="4" y="4" width="144" height="158" rx="11" fill="#070C16" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.3"/>

    <!-- Concentric Technical Radar Dials -->
    <g transform="translate(76, 70)">
      <circle cx="0" cy="0" r="46" stroke="#1E293B" stroke-width="1" fill="none"/>
      <circle cx="0" cy="0" r="46" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 14" stroke-opacity="0.6" fill="none" class="orbit-cw" style="transform-origin: 0 0;"/>
      <circle cx="0" cy="0" r="32" stroke="#0284C7" stroke-width="1" stroke-dasharray="4 12" stroke-opacity="0.5" fill="none" class="orbit-ccw" style="transform-origin: 0 0;"/>
      <circle cx="0" cy="0" r="18" stroke="#1E293B" stroke-width="1" fill="#0A111F"/>

      <!-- Sweeping Radar Beam -->
      <g class="orbit-cw" style="transform-origin: 0 0; animation-duration: 3.5s;">
        <path d="M 0 0 L 44 -14 A 46 46 0 0 1 46 0 Z" fill="url(#radarCone)"/>
        <line x1="0" y1="0" x2="46" y2="0" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- Center Node -->
      <circle cx="0" cy="0" r="4.5" fill="#38BDF8"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="4" stroke="#38BDF8" fill="none" class="sonar-ping"/>
    </g>

    <!-- Radar Footer Label -->
    <g transform="translate(0, 128)">
      <line x1="12" y1="0" x2="140" y2="0" stroke="#1E293B" stroke-width="1"/>
      <text x="76" y="16" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="800" fill="#F8FAFC" letter-spacing="1px">SIH FINALIST</text>
      <text x="76" y="28" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600" fill="#38BDF8" letter-spacing="0.5px">B.TECH CSE • 2023-27</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="45%" stop-color="#0D131F"/>
      <stop offset="100%" stop-color="#0A1018"/>
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="heroCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="heroEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="100%" stop-color="#11998E"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#303E4D" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1F2833" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Monogram Glow Filter -->
    <filter id="monogramGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Refined Background Dot Grid -->
    <pattern id="heroGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#202A36" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseBeam {
      0% { stroke-dashoffset: 400; opacity: 0.15; }
      50% { opacity: 0.85; }
      100% { stroke-dashoffset: 0; opacity: 0.15; }
    }
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes orbitRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .flow-trace {
      stroke-dasharray: 80 160;
      animation: pulseBeam 8s linear infinite;
    }
    .node-glow-anim {
      animation: subtlePulse 2.8s ease-in-out infinite;
    }
    .orbit-spin {
      transform-origin: 820px 110px;
      animation: orbitRotate 12s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: 4.5px;
      fill: #F0F6FC;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 2px;
      font-size: 11.5px;
      fill: #8B949E;
    }
    .mono-chip {
      font-family: "SF Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 1.2px;
      fill: #38EF7D;
      font-weight: 600;
    }
  </style>

  <!-- Container Box with Rounded Edges -->
  <rect x="1" y="1" width="938" height="218" rx="14" fill="url(#heroBg)" stroke="url(#heroBorder)" stroke-width="1.5"/>

  <!-- Background Grid -->
  <rect x="2" y="2" width="936" height="216" rx="13" fill="url(#heroGrid)"/>

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="105" cy="110" r="85" fill="#00F2FE" fill-opacity="0.03"/>
  <circle cx="820" cy="110" r="95" fill="#38EF7D" fill-opacity="0.025"/>

  <!-- Horizontal Tech Guide Lines -->
  <path d="M 210 40 L 760 40 L 800 70 L 900 70" stroke="#1F2A38" stroke-width="1" fill="none"/>
  <path d="M 210 40 L 760 40 L 800 70 L 900 70" stroke="url(#heroCyan)" stroke-width="1.4" fill="none" class="flow-trace"/>

  <path d="M 230 180 L 720 180 L 750 150 L 900 150" stroke="#1F2A38" stroke-width="1" fill="none"/>
  <path d="M 230 180 L 720 180 L 750 150 L 900 150" stroke="url(#heroEmerald)" stroke-width="1.4" fill="none" class="flow-trace" style="animation-duration: 11s;"/>

  <!-- Monogram Logo Container (Left) -->
  <g transform="translate(40, 45)">
    <!-- Base Rounded Badge -->
    <rect x="0" y="0" width="130" height="130" rx="18" fill="#101620" stroke="#253243" stroke-width="1.5"/>
    <rect x="6" y="6" width="118" height="118" rx="14" fill="#0A0E16" stroke="url(#heroCyan)" stroke-width="1" stroke-opacity="0.35"/>

    <!-- Geometric "PR" Monogram -->
    <g transform="translate(10, 8)">
      <!-- Letter 'P' -->
      <path d="M 25 30 L 25 84" stroke="#F0F6FC" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M 25 30 L 44 30 C 54 30 59 36 59 45 C 59 54 54 60 44 60 L 25 60" stroke="#F0F6FC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Letter 'R' -->
      <path d="M 64 30 L 64 84" stroke="#F0F6FC" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M 64 30 L 83 30 C 93 30 98 36 98 45 C 98 54 93 60 83 60 L 64 60" stroke="#F0F6FC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- 'R' Dynamic Electric Cyan Leg -->
      <path d="M 80 60 L 98 84" stroke="url(#heroCyan)" stroke-width="5.2" stroke-linecap="round" fill="none" filter="url(#monogramGlow)"/>
      <path d="M 80 60 L 98 84" stroke="#00F2FE" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Status Indicator Pill in Monogram -->
    <rect x="8" y="104" width="114" height="18" rx="9" fill="#131B26" stroke="#212F40" stroke-width="1"/>
    <circle cx="18" cy="113" r="3.5" fill="#38EF7D" class="node-glow-anim"/>
    <text x="26" y="117" font-family="'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600" fill="#8B949E" letter-spacing="0.5px">AVAILABLE // 2026</text>
  </g>

  <!-- Main Headline & Identity (Center-Left) -->
  <g transform="translate(198, 0)">
    <!-- Status / Role Chip -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="232" height="22" rx="4" fill="#121822" stroke="#263548" stroke-width="1"/>
      <circle cx="12" cy="11" r="3" fill="#00F2FE" class="node-glow-anim"/>
      <text x="22" y="15" class="mono-chip" fill="#00F2FE">SOFTWARE ENGINEER &amp; BUILDER</text>
    </g>

    <!-- Primary Name -->
    <text x="0" y="102" font-size="33" class="title-text">PRIYA RANJAN</text>

    <!-- Professional Tagline -->
    <text x="2" y="128" class="subtitle-text">ENGINEER  •  SYSTEMS BUILDER  •  PROBLEM SOLVER</text>

    <!-- Categorized Competency Pills -->
    <g transform="translate(2, 150)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="138" height="22" rx="4" fill="#121824" stroke="#202D3E" stroke-width="1"/>
      <text x="10" y="15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#00F2FE" letter-spacing="0.8px">SYSTEMS &amp; LOW-LEVEL</text>

      <!-- Pill 2 -->
      <rect x="146" y="0" width="128" height="22" rx="4" fill="#121824" stroke="#202D3E" stroke-width="1"/>
      <text x="156" y="15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#38EF7D" letter-spacing="0.8px">AI &amp; DEEP LEARNING</text>

      <!-- Pill 3 -->
      <rect x="282" y="0" width="138" height="22" rx="4" fill="#121824" stroke="#202D3E" stroke-width="1"/>
      <text x="292" y="15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#C9D1D9" letter-spacing="0.8px">DEFENSIVE SECURITY</text>

      <!-- Pill 4 -->
      <rect x="428" y="0" width="122" height="22" rx="4" fill="#121824" stroke="#202D3E" stroke-width="1"/>
      <text x="438" y="15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#8B949E" letter-spacing="0.8px">FULL-STACK CLOUD</text>
    </g>
  </g>

  <!-- Right Systems Telemetry Node Graph (Clean & Elegant) -->
  <g transform="translate(775, 45)">
    <!-- Base Card Container -->
    <rect x="0" y="0" width="125" height="130" rx="12" fill="#0E141E" stroke="#212F40" stroke-width="1"/>

    <!-- Rotating Tech Dial Rings -->
    <circle cx="62" cy="52" r="34" stroke="#1D2A3B" stroke-width="1.2" fill="none"/>
    <circle cx="62" cy="52" r="34" stroke="#00F2FE" stroke-width="1.4" stroke-dasharray="6 14" stroke-opacity="0.6" fill="none" class="orbit-spin" style="transform-origin: 837px 97px;"/>
    <circle cx="62" cy="52" r="22" stroke="#23354B" stroke-width="1" fill="#0A0F17"/>

    <!-- Center Node Pulse -->
    <circle cx="62" cy="52" r="4.5" fill="#38EF7D" class="node-glow-anim" filter="url(#monogramGlow)"/>
    <circle cx="62" cy="52" r="2" fill="#FFFFFF"/>

    <!-- Mini Telemetry Stat 1 -->
    <text x="62" y="100" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#F0F6FC" letter-spacing="1px">B.TECH CSE</text>
    <text x="62" y="114" text-anchor="middle" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="500" fill="#8B949E" letter-spacing="0.5px">2023 — 2027</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">TrustShield-X — defensive security</title><desc id="desc">A custom shield and checkmark logo with a controlled radar sweep and linked security nodes.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06120A"/><stop offset="1" stop-color="#08170B"/></linearGradient><linearGradient id="cyan"><stop stop-color="#39FF14"/><stop offset="1" stop-color="#00C853"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#174A24" stroke-width=".7"/></pattern></defs><rect width="760" height="360" fill="url(#bg)"/><rect width="760" height="360" fill="url(#grid)" opacity=".7"/><text x="28" y="29" fill="#39FF14" font-family="monospace" font-size="11" letter-spacing="2">BLUE NOVA / DEFENSIVE SECURITY</text><circle cx="718" cy="26" r="4" fill="#39FF14"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></circle><g stroke="#247A35" stroke-width="1.5" opacity=".8"><path d="M174 112L260 82L328 125L430 85L520 126L588 98M174 112L240 202L328 125L360 214L520 126L548 208L360 214L240 202M260 82L360 214M430 85L548 208"/></g><g fill="#39FF14"><circle cx="174" cy="112" r="4"/><circle cx="260" cy="82" r="4"/><circle cx="328" cy="125" r="4"/><circle cx="430" cy="85" r="4"/><circle cx="520" cy="126" r="4"/><circle cx="588" cy="98" r="4"/><circle cx="240" cy="202" r="4"/><circle cx="360" cy="214" r="4"/><circle cx="548" cy="208" r="4"/></g><g transform="translate(380 150)"><circle r="77" fill="#081923" stroke="#1C5A2A"/><circle r="64" fill="none" stroke="#39FF14" stroke-dasharray="4 9" opacity=".55"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/></circle><path d="M0 -43L34 -29V2C34 27 15 42 0 50C-15 42 -34 27 -34 2V-29Z" fill="#0b2c3a" stroke="url(#cyan)" stroke-width="3"/><path d="M-17 0L-4 14L21 -15" fill="none" stroke="#B9FFB0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60"><animate attributeName="stroke-dashoffset" values="60;0;0" dur="3.5s" repeatCount="indefinite"/></path><circle r="88" fill="none" stroke="#39FF14" opacity=".2"><animate attributeName="r" values="78;95;78" dur="4s" repeatCount="indefinite"/></circle></g><text x="380" y="260" text-anchor="middle" fill="#e8f7ff" font-family="monospace" font-size="17" font-weight="700" letter-spacing="3">TRUSTSHIELD-X</text><text x="380" y="280" text-anchor="middle" fill="#6fa7b9" font-family="monospace" font-size="10" letter-spacing="2">THREAT SIGNALS / DEFENSE MODE</text><rect x="180" y="302" width="400" height="4" rx="2" fill="#174A24"/><rect x="180" y="302" width="100" height="4" rx="2" fill="#39FF14"><animate attributeName="width" values="80;300;140;80" dur="6s" repeatCount="indefinite"/></rect><text x="28" y="342" fill="#B9FFB0" font-family="monospace" font-size="12" letter-spacing="1.4">TRUSTSHIELD-X / THREAT SIGNALS</text></svg>
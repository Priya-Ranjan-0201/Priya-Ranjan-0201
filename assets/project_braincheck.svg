<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">BrainCheck — cognitive assessment</title><desc id="desc">A custom brain-inspired geometric logo, connected neural nodes, and a gently animated progress meter.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#0a202b"/></linearGradient><linearGradient id="cyan"><stop stop-color="#00e5ff"/><stop offset="1" stop-color="#438cff"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#153747" stroke-width=".7"/></pattern></defs><rect width="760" height="360" fill="url(#bg)"/><rect width="760" height="360" fill="url(#grid)" opacity=".7"/><text x="28" y="29" fill="#00e5ff" font-family="monospace" font-size="11" letter-spacing="2">BLUE NOVA / COGNITIVE CHECK</text><circle cx="718" cy="26" r="4" fill="#00e5ff"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle><g transform="translate(380 132)"><circle r="78" fill="#081923" stroke="#174555"/><circle r="64" fill="none" stroke="#00e5ff" stroke-dasharray="3 11" opacity=".5"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="30s" repeatCount="indefinite"/></circle><path d="M-2 -42C-26 -55 -45 -35 -39 -16C-53 -2 -42 17 -28 18C-29 37 -8 42 0 27V-35M2 -42C26 -55 45 -35 39 -16C53 -2 42 17 28 18C29 37 8 42 0 27V-35" fill="#0b2c3a" stroke="url(#cyan)" stroke-width="3" stroke-linejoin="round"/><path d="M-24 -25L-10 -13L-23 1L-8 15M24 -25L10 -13L23 1L8 15M0 -35V27" fill="none" stroke="#7df8ff" stroke-width="2" stroke-linecap="round"/><g fill="#00e5ff"><circle cx="-24" cy="-25" r="3"><animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/></circle><circle cx="24" cy="-25" r="3"><animate attributeName="r" values="2;4;2" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="0" cy="27" r="3"><animate attributeName="r" values="2;4;2" dur="2.2s" repeatCount="indefinite"/></circle></g><circle r="88" fill="none" stroke="#00e5ff" opacity=".2"><animate attributeName="r" values="80;94;80" dur="4.5s" repeatCount="indefinite"/></circle></g><text x="380" y="239" text-anchor="middle" fill="#e8f7ff" font-family="monospace" font-size="17" font-weight="700" letter-spacing="4">BRAINCHECK</text><text x="380" y="259" text-anchor="middle" fill="#6fa7b9" font-family="monospace" font-size="10" letter-spacing="2">COGNITION / PATTERN / PROGRESS</text><rect x="130" y="292" width="500" height="7" rx="3.5" fill="#173746"/><rect x="130" y="292" width="210" height="7" rx="3.5" fill="url(#cyan)"><animate attributeName="width" values="170;320;210" dur="6s" repeatCount="indefinite"/></rect><circle cx="340" cy="295.5" r="5" fill="#e7ffff"><animate attributeName="cx" values="300;450;340" dur="6s" repeatCount="indefinite"/></circle><text x="28" y="342" fill="#bdebf3" font-family="monospace" font-size="12" letter-spacing="1.4">BRAINCHECK / QUIZ PROGRESS</text></svg>
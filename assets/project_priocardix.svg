<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">PRIOCARDIX-AI</title><desc id="desc">Cardiac signal visualization with a gently moving ECG trace and pulse marker.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#123443" stroke-width="1"/></pattern></defs><rect width="760" height="360" fill="#07131c"/><rect width="760" height="360" fill="url(#g)"/><text x="28" y="29" fill="#00e5ff" font-family="monospace" font-size="11" letter-spacing="2">BLUE NOVA / SIGNAL ANALYSIS</text><circle cx="718" cy="26" r="5" fill="#00e5ff"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle><rect x="82" y="54" width="596" height="238" rx="14" fill="#081a24" stroke="#00bcd4" stroke-width="1.5"/><g fill="#0d2a37" stroke="#155064"><rect x="110" y="78" width="138" height="28" rx="6"/><rect x="266" y="78" width="138" height="28" rx="6"/><rect x="422" y="78" width="190" height="28" rx="6"/></g><g fill="#bdebf3" font-family="monospace" font-size="11"><text x="126" y="96">SIGNAL</text><text x="282" y="96">ANALYSIS</text><text x="438" y="96">RISK INDICATORS</text></g><path d="M108 190H210L230 190L250 155L274 232L298 174L319 190H375L396 190L416 158L439 229L462 174L483 190H630" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linejoin="round" stroke-dasharray="700" stroke-dashoffset="700"><animate attributeName="stroke-dashoffset" values="700;0;0" dur="4.5s" repeatCount="indefinite"/></path><circle cx="274" cy="232" r="5" fill="#00e5ff"><animate attributeName="r" values="3;7;3" dur="1.2s" repeatCount="indefinite"/></circle><path d="M108 258H630" stroke="#173b49" stroke-width="2"/><text x="28" y="337" fill="#bdebf3" font-family="monospace" font-size="12" letter-spacing="1.4">PRIOCARDIX-AI / ECG VISUALIZER</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Priocardix-AI — cardiac signal analysis</title><desc id="desc">A custom heart and ECG logo paired with a clean waveform, animated scan line, and pulsing signal point.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#0a202b"/></linearGradient><linearGradient id="cyan"><stop stop-color="#00e5ff"/><stop offset="1" stop-color="#4c8dff"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#153747" stroke-width=".7"/></pattern></defs><rect width="760" height="360" fill="url(#bg)"/><rect width="760" height="360" fill="url(#grid)" opacity=".7"/><text x="28" y="29" fill="#00e5ff" font-family="monospace" font-size="11" letter-spacing="2">BLUE NOVA / SIGNAL ANALYSIS</text><circle cx="718" cy="26" r="4" fill="#00e5ff"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle><g transform="translate(380 126)"><circle r="76" fill="#081923" stroke="#174555"/><circle r="64" fill="none" stroke="#00e5ff" stroke-dasharray="3 10" opacity=".55"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/></circle><path d="M0 43C-14 29 -45 6 -45 -17C-45 -42 -14 -46 0 -24C14 -46 45 -42 45 -17C45 6 14 29 0 43Z" fill="#0b2c3a" stroke="url(#cyan)" stroke-width="3"/><path d="M-33 -2H-15L-6 -18L7 15L18 -7H34" fill="none" stroke="#7df8ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;0;0" dur="3.8s" repeatCount="indefinite"/></path><circle cx="0" cy="-58" r="4" fill="#00e5ff"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle></g><text x="380" y="226" text-anchor="middle" fill="#e8f7ff" font-family="monospace" font-size="17" font-weight="700" letter-spacing="3">PRIOCARDIX-AI</text><text x="380" y="246" text-anchor="middle" fill="#6fa7b9" font-family="monospace" font-size="10" letter-spacing="2">CARDIAC SIGNAL / DATA INSIGHTS</text><rect x="100" y="279" width="560" height="44" rx="8" fill="#081a24" stroke="#194454"/><path d="M120 302H206L222 302L239 286L257 315L277 292L294 302H380L398 302L416 286L434 315L454 292L472 302H640" fill="none" stroke="#00e5ff" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="600" stroke-dashoffset="600"><animate attributeName="stroke-dashoffset" values="600;0;0" dur="5s" repeatCount="indefinite"/></path><text x="28" y="342" fill="#bdebf3" font-family="monospace" font-size="12" letter-spacing="1.4">PRIOCARDIX-AI / ECG VISUALIZER</text></svg>
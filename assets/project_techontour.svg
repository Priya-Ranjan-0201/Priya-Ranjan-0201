<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Tech On Tour — travel discovery</title><desc id="desc">A custom location-pin globe mark with an animated route dash and softly pulsing destination markers.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#0a202c"/></linearGradient><linearGradient id="cyan"><stop stop-color="#00e5ff"/><stop offset="1" stop-color="#438cff"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#153747" stroke-width=".7"/></pattern></defs><rect width="760" height="360" fill="url(#bg)"/><rect width="760" height="360" fill="url(#grid)" opacity=".7"/><text x="28" y="29" fill="#00e5ff" font-family="monospace" font-size="11" letter-spacing="2">BLUE NOVA / TRAVEL DISCOVERY</text><circle cx="718" cy="26" r="4" fill="#00e5ff"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle><g transform="translate(380 146)"><circle r="83" fill="#081c27" stroke="#00bcd4" stroke-width="1.5"/><ellipse rx="38" ry="83" fill="none" stroke="#21677a"/><ellipse rx="83" ry="31" fill="none" stroke="#21677a"/><path d="M-81 0H81M0 -81V81" stroke="#21677a" opacity=".7"/><circle r="70" fill="none" stroke="#00e5ff" stroke-dasharray="2 11" opacity=".5"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/></circle><path d="M-51 34Q-18 -47 18 -5T53 -37" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"><animate attributeName="stroke-dashoffset" values="0;-30" dur="2.8s" repeatCount="indefinite"/></path><g transform="translate(53 -37)"><path d="M0 -13C-9 -13 -13 -6 -13 0C-13 10 0 21 0 21S13 10 13 0C13 -6 9 -13 0 -13Z" fill="url(#cyan)"/><circle cy="0" r="4" fill="#07131c"/></g><circle cx="-51" cy="34" r="5" fill="#00e5ff"><animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/></circle></g><text x="380" y="258" text-anchor="middle" fill="#e8f7ff" font-family="monospace" font-size="17" font-weight="700" letter-spacing="4">TECH ON TOUR</text><text x="380" y="278" text-anchor="middle" fill="#6fa7b9" font-family="monospace" font-size="10" letter-spacing="2">DISCOVER / ROUTE / EXPERIENCE</text><path d="M130 306H630" stroke="#173746" stroke-width="2"/><path d="M130 306H250" stroke="#00e5ff" stroke-width="2"><animate attributeName="stroke-dasharray" values="30 470;160 340;30 470" dur="5s" repeatCount="indefinite"/></path><text x="28" y="342" fill="#bdebf3" font-family="monospace" font-size="12" letter-spacing="1.4">TECH ON TOUR / ROUTE EXPLORER</text></svg>
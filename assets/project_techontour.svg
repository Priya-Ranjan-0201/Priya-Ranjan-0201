<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">TECH ON TOUR</title><desc id="desc">Travel discovery globe with a moving route between destination markers.</desc><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#123443" stroke-width="1"/></pattern></defs><rect width="760" height="360" fill="#07131c"/><rect width="760" height="360" fill="url(#g)"/><text x="28" y="29" fill="#00e5ff" font-family="monospace" font-size="11" letter-spacing="2">BLUE NOVA / TRAVEL DISCOVERY</text><circle cx="718" cy="26" r="5" fill="#00e5ff"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle><circle cx="380" cy="175" r="116" fill="#092331" stroke="#00e5ff" stroke-width="2"/><ellipse cx="380" cy="175" rx="52" ry="116" fill="none" stroke="#16849a" stroke-width="1.5"/><ellipse cx="380" cy="175" rx="116" ry="42" fill="none" stroke="#16849a" stroke-width="1.5"/><path d="M266 175H494M380 59V291" fill="none" stroke="#16849a" stroke-width="1.2"/><path d="M300 220Q340 105 400 157T472 119" fill="none" stroke="#00e5ff" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-32" dur="2s" repeatCount="indefinite"/></path><g fill="#00e5ff"><circle cx="300" cy="220" r="7"/><circle cx="400" cy="157" r="7"/><circle cx="472" cy="119" r="7"><animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/></circle></g><rect x="60" y="292" width="640" height="2" fill="#143745"/><text x="28" y="337" fill="#bdebf3" font-family="monospace" font-size="12" letter-spacing="1.4">TECH ON TOUR / ROUTE EXPLORER</text></svg>
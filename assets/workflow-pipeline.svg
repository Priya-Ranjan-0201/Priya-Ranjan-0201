<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="100%" fill="none">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#091122"/>
      <stop offset="100%" stop-color="#060A14"/>
    </linearGradient>

    <linearGradient id="pipeGlowBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="25%" stop-color="#4FACFE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="75%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#00FF87"/>
    </linearGradient>

    <linearGradient id="activeBorderPipe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes flowPacketLine {
      0% { stroke-dashoffset: 600; opacity: 0.15; }
      50% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.15; }
    }
    @keyframes nodePulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #00F2FE); }
    }
    @keyframes marchPipeBorder {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 600; }
    }

    .flow-stream {
      stroke-dasharray: 60 160;
      animation: flowPacketLine 5s linear infinite;
    }
    .node-pulse-ring {
      transform-origin: 0 0;
      animation: nodePulseGlow 2.5s ease-in-out infinite;
    }
    .pipe-border-anim {
      stroke-dasharray: 80 180;
      animation: marchPipeBorder 10s linear infinite;
    }
    .stage-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #F0F6FC;
    }
    .stage-num {
      font-family: "SF Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
      font-weight: 700;
      font-size: 9.5px;
      letter-spacing: 1px;
    }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="876" height="116" rx="14" fill="url(#pipeBg)" stroke="#192A40" stroke-width="1.5"/>
  <rect x="2" y="2" width="876" height="116" rx="14" fill="none" stroke="url(#activeBorderPipe)" stroke-width="2" class="pipe-border-anim" filter="url(#laserGlow)"/>

  <!-- Static Pipeline Track -->
  <line x1="70" y1="60" x2="810" y2="60" stroke="#16253B" stroke-width="3"/>

  <!-- Animated High-Speed Data Packet Flow -->
  <line x1="70" y1="60" x2="810" y2="60" stroke="url(#pipeGlowBeam)" stroke-width="3.5" stroke-linecap="round" class="flow-stream" filter="url(#laserGlow)"/>

  <!-- Node 1: PROBLEM -->
  <g transform="translate(70, 60)">
    <circle cx="0" cy="0" r="19" fill="#0C1527" stroke="#00F2FE" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="7" fill="#00F2FE" filter="url(#laserGlow)"/>
    <text x="0" y="-30" text-anchor="middle" class="stage-num" fill="#00F2FE">01</text>
    <text x="0" y="38" text-anchor="middle" class="stage-title">PROBLEM</text>
  </g>

  <!-- Node 2: RESEARCH -->
  <g transform="translate(218, 60)">
    <circle cx="0" cy="0" r="19" fill="#0C1527" stroke="#4FACFE" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="7" fill="#4FACFE" filter="url(#laserGlow)"/>
    <text x="0" y="-30" text-anchor="middle" class="stage-num" fill="#4FACFE">02</text>
    <text x="0" y="38" text-anchor="middle" class="stage-title">RESEARCH</text>
  </g>

  <!-- Node 3: ARCHITECTURE -->
  <g transform="translate(366, 60)">
    <circle cx="0" cy="0" r="19" fill="#0C1527" stroke="#A855F7" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="7" fill="#A855F7" filter="url(#laserGlow)"/>
    <text x="0" y="-30" text-anchor="middle" class="stage-num" fill="#A855F7">03</text>
    <text x="0" y="38" text-anchor="middle" class="stage-title">ARCHITECTURE</text>
  </g>

  <!-- Node 4: CODE -->
  <g transform="translate(514, 60)">
    <circle cx="0" cy="0" r="19" fill="#0C1527" stroke="#EC4899" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="7" fill="#EC4899" filter="url(#laserGlow)"/>
    <text x="0" y="-30" text-anchor="middle" class="stage-num" fill="#EC4899">04</text>
    <text x="0" y="38" text-anchor="middle" class="stage-title">CODE</text>
  </g>

  <!-- Node 5: STRESS TEST -->
  <g transform="translate(662, 60)">
    <circle cx="0" cy="0" r="19" fill="#0C1527" stroke="#00F2FE" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="7" fill="#00F2FE" filter="url(#laserGlow)"/>
    <text x="0" y="-30" text-anchor="middle" class="stage-num" fill="#00F2FE">05</text>
    <text x="0" y="38" text-anchor="middle" class="stage-title">STRESS TEST</text>
  </g>

  <!-- Node 6: IMPACT -->
  <g transform="translate(810, 60)">
    <circle cx="0" cy="0" r="22" fill="#0B1A1E" stroke="#00FF87" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8" fill="#00FF87" filter="url(#laserGlow)"/>
    <text x="0" y="-30" text-anchor="middle" class="stage-num" fill="#00FF87">06</text>
    <text x="0" y="38" text-anchor="middle" class="stage-title" fill="#00FF87">IMPACT</text>
  </g>
</svg>

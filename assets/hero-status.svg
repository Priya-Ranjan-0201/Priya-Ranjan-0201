<svg xmlns="http://www.w3.org/2000/svg" width="760" height="54" viewBox="0 0 760 54" role="img" aria-labelledby="title desc">
<title id="title">Green Nova animated status line</title>
<desc id="desc">A compact neon green status bar with softly pulsing signal dots and a moving scan line.</desc>
<defs>
  <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#39FF14" stop-opacity="0"/><stop offset=".5" stop-color="#39FF14"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="758" height="52" rx="10" fill="#07131C" stroke="#1C5A2A"/>
<path d="M20 27 H740" stroke="#12313D" stroke-width="1"/>
<path d="M20 27 H740" stroke="url(#line)" stroke-width="2" stroke-dasharray="90 670">
  <animate attributeName="stroke-dashoffset" values="760;0" dur="5s" repeatCount="indefinite"/>
</path>
<circle cx="25" cy="27" r="4" fill="#39FF14"><animate attributeName="opacity" values=".45;1;.45" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="42" y="23" font-family="monospace" font-size="10" fill="#39FF14" letter-spacing="1.6">SYSTEM STATUS</text>
<text x="42" y="38" font-family="monospace" font-size="11" fill="#D8E7F0">LEARNING  /  BUILDING  /  ITERATING</text>
<text x="718" y="30" text-anchor="end" font-family="monospace" font-size="10" fill="#8DBF91">ONLINE · 01</text>
<circle cx="735" cy="27" r="3" fill="#39FF14"><animate attributeName="r" values="2.5;4;2.5" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>
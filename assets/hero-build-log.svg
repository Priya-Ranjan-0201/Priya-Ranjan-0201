<svg xmlns="http://www.w3.org/2000/svg" width="760" height="58" viewBox="0 0 760 58" role="img" aria-labelledby="title desc">
<title id="title">Animated Blue Nova developer tagline</title>
<desc id="desc">A compact terminal-style line cycles through building, learning, and securing software, with a blinking cyan cursor.</desc>
<rect x="1" y="1" width="758" height="56" rx="9" fill="#07131C" stroke="#173B49"/>
<path d="M18 18H742" stroke="#12313D"/>
<circle cx="18" cy="18" r="3" fill="#00E5FF"><animate attributeName="opacity" values="1;.3;1" dur="1.7s" repeatCount="indefinite"/></circle>
<text x="31" y="22" fill="#00E5FF" font-family="monospace" font-size="9" letter-spacing="1.5">BLUE NOVA / BUILD LOG</text>
<g font-family="monospace" font-size="13" fill="#D8E7F0">
  <text x="24" y="43" opacity="1"> &gt; Building useful systems<tspan fill="#00E5FF">_</tspan><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.32;.36;.94;1" dur="7.5s" repeatCount="indefinite"/></text>
  <text x="24" y="43" opacity="0"> &gt; Learning by shipping<tspan fill="#00E5FF">_</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.32;.36;.62;.66" dur="7.5s" repeatCount="indefinite"/></text>
  <text x="24" y="43" opacity="0"> &gt; Engineering with intent<tspan fill="#00E5FF">_</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.62;.66;.94;1" dur="7.5s" repeatCount="indefinite"/></text>
</g>
<rect x="738" y="34" width="5" height="12" rx="1" fill="#00E5FF"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>
</svg>
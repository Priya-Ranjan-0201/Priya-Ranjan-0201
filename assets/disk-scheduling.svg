<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Disk Scheduling Visualizer</title><desc id="desc">Animated disk head traverses cylinder requests in a green terminal style.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06120A"/><stop offset="1" stop-color="#0A1B0D"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#174A24" stroke-width=".7" opacity=".8"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="760" height="300" rx="12" fill="url(#bg)" stroke="#247A35"/><rect width="760" height="300" rx="12" fill="url(#grid)"/>
<text x="26" y="27" fill="#39FF14" font-family="monospace" font-size="10" letter-spacing="2">GREEN NOVA / OPERATING SYSTEMS</text><circle cx="727" cy="24" r="4" fill="#39FF14"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
<text x="26" y="59" fill="#E8F7E8" font-family="monospace" font-size="20" font-weight="700" letter-spacing="1">DISK SCHEDULING</text><text x="26" y="78" fill="#8DBF91" font-family="monospace" font-size="10" letter-spacing="1.3">CYLINDER REQUESTS / SEEK-PATH SIMULATION</text>
<g stroke="#174A24" stroke-width="1"><path d="M60 116H700M60 154H700M60 192H700M60 230H700"/><path d="M100 100V242M200 100V242M300 100V242M400 100V242M500 100V242M600 100V242M680 100V242" stroke-dasharray="3 6"/></g>
<g fill="#B9FFB0" font-family="monospace" font-size="9" text-anchor="middle"><text x="100" y="96">0</text><text x="200" y="96">100</text><text x="300" y="96">200</text><text x="400" y="96">300</text><text x="500" y="96">400</text><text x="600" y="96">500</text><text x="680" y="96">600</text></g>
<path d="M500 116L150 154L330 154L250 192L570 192L430 230L650 154" fill="none" stroke="#39FF14" stroke-width="2" stroke-dasharray="7 6" opacity=".7"><animate attributeName="stroke-dashoffset" values="0;-26" dur="2.2s" repeatCount="indefinite"/></path>
<g fill="#08170B" stroke="#39FF14" stroke-width="1.5"><circle cx="150" cy="154" r="6"/><circle cx="250" cy="192" r="6"/><circle cx="330" cy="154" r="6"/><circle cx="430" cy="230" r="6"/><circle cx="570" cy="192" r="6"/><circle cx="650" cy="154" r="6"/></g>
<g fill="#B9FFB0" font-family="monospace" font-size="9" text-anchor="middle"><text x="150" y="141">98</text><text x="250" y="179">183</text><text x="330" y="141">276</text><text x="430" y="217">381</text><text x="570" y="179">460</text><text x="650" y="141">562</text></g>
<g filter="url(#glow)"><circle r="10" fill="#39FF14" opacity=".18"><animateMotion dur="7s" repeatCount="indefinite" path="M500 116 L150 154 L330 154 L250 192 L570 192 L430 230 L650 154"/></circle><circle r="5" fill="#F0FFF0" stroke="#39FF14" stroke-width="2"><animateMotion dur="7s" repeatCount="indefinite" path="M500 116 L150 154 L330 154 L250 192 L570 192 L430 230 L650 154"/></circle></g>
<rect x="26" y="255" width="708" height="27" rx="6" fill="#08170B" stroke="#1C5A2A"/><circle cx="40" cy="268.5" r="3.5" fill="#39FF14"><animate attributeName="r" values="2.5;4;2.5" dur="1.8s" repeatCount="indefinite"/></circle><text x="52" y="272" fill="#39FF14" font-family="monospace" font-size="10" letter-spacing=".8">FCFS · SSTF · SCAN · C-SCAN · LOOK · C-LOOK · 11 ALGORITHMS</text><text x="719" y="272" fill="#B9FFB0" font-family="monospace" font-size="9" text-anchor="end">HEAD ACTIVE</text>
</svg>